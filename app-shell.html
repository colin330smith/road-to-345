<meta charset="utf-8">
<title>Road to 3/4/5</title>
<style>
  :root{
    --iron:#101216; --plate:#1a1e24; --plate2:#20252d; --steel:#2a303a;
    --chalk:#e9e7e1; --ash:#8b919c; --signal:#ffb224;
    --go:#46b073; --stop:#e4574b;
    --disp:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Arial Narrow',sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--iron);color:var(--chalk);font-family:var(--body);line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  #app{max-width:560px;margin:0 auto;padding:0 14px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--chalk);background:var(--iron);
    border:1px solid var(--steel);border-radius:8px;padding:6px 8px}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  input[type=number]{width:66px;text-align:center;font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--iron) 82%,rgba(16,18,22,0));
    padding:9px 0 7px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
  .brand h1 b{color:var(--signal);font-weight:700}
  .ctx{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--ash)}
  .ctx b{color:var(--chalk)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,23,29,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--steel);
    padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;
    color:var(--ash);padding:10px 2px 8px;border-radius:8px;text-align:center}
  .tab.on{color:var(--signal);background:rgba(255,178,36,.09)}

  .card{background:var(--plate);border:1px solid var(--steel);border-radius:12px;padding:11px 12px 9px;margin:8px 0}
  .card.single{background:linear-gradient(160deg,#232019 0%,var(--plate) 55%);border-color:#4a3d1d}
  .eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;color:var(--ash);margin-bottom:2px}
  .eyebrow.sig{color:var(--signal)}
  .rx{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .rx small{font-size:14px;font-weight:600;color:var(--ash);letter-spacing:0}
  .capnote{font-size:12.5px;color:var(--ash);margin-top:2px}
  .capnote b{color:var(--chalk)}
  .warn{color:var(--signal)}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ibtn{color:var(--ash);border:1px solid var(--steel);border-radius:999px;width:34px;height:34px;
    font-size:15px;line-height:1;flex:none}
  .done .rx{color:var(--go)}

  .setrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{min-width:52px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:9px;border:1px solid var(--steel);
    background:var(--plate2);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ash)}
  .chip.hit{background:rgba(70,176,115,.14);border-color:#2c5c42;color:var(--go)}
  .chip.add{color:var(--signal);border-style:dashed}
  .chip.hard{border-color:#6b5518;color:var(--signal)}
  .chip.hard small{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.85}
  .lset{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0}
  .lset .x{color:var(--ash);margin-left:auto;padding:4px 8px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
  .seg button{padding:10px 4px;border-radius:9px;border:1px solid var(--steel);font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ash)}
  .seg .g.on{background:rgba(70,176,115,.15);border-color:#2c5c42;color:var(--go)}
  .seg .y.on{background:rgba(255,178,36,.13);border-color:#6b5518;color:var(--signal)}
  .seg .r.on{background:rgba(228,87,75,.13);border-color:#6b2b25;color:var(--stop)}

  .daynav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .daynav button{font-size:20px;color:var(--ash);padding:4px 14px}
  .daynav .dt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--chalk)}
  .metrics{display:flex;gap:10px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
  .metrics label{font-size:12.5px;color:var(--ash)}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ash);
    text-align:left;padding:5px 6px;border-bottom:1px solid var(--steel)}
  td{padding:6px;border-bottom:1px solid #232830}
  .tablewrap{overflow-x:auto}

  .wavecard{display:block;width:100%;text-align:left}
  .wavecard .cbline{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .wavecard.now{border-color:#6b5518;background:linear-gradient(160deg,#242017 0%,var(--plate) 60%)}
  .wavecard.done19{border-color:#2c5c42}
  .gatechip{display:inline-block;font-size:11px;border:1px solid var(--steel);border-radius:999px;
    padding:2px 8px;margin-right:4px;color:var(--ash)}
  .gatechip.clean{color:var(--go);border-color:#2c5c42}
  .gatechip.warn{color:var(--signal);border-color:#6b5518}

  .moverow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 4px;
    border-bottom:1px solid #232830}
  .moverow .nm{font-weight:600;font-size:15px}
  .moverow .tag{font-size:12px;color:var(--ash)}
  .moverow canvas{flex:none;background:var(--plate);border-radius:8px}
  .grp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--signal);
    margin:18px 0 2px}

  #modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,11,14,.72)}
  #modal.open{display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--plate);border:1px solid var(--steel);border-radius:16px 16px 0 0;width:100%;
    max-width:560px;max-height:86vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:19px;margin-bottom:6px}
  .closex{float:right;color:var(--ash);font-size:22px;padding:2px 10px}
  .cues{margin:10px 0 4px;padding-left:18px;font-size:14.5px}
  .cues li{margin:5px 0}
  .ytlink{display:inline-block;margin-top:10px;color:var(--signal);font-size:14px;text-decoration:none;
    border:1px solid #6b5518;border-radius:999px;padding:6px 14px}

  .btn{display:inline-block;background:var(--signal);color:#1b1405;font-weight:700;border-radius:9px;
    padding:10px 16px;font-size:14.5px;border:1px solid transparent}
  .btn.ghost{background:none;border:1px solid var(--steel);color:var(--chalk);font-weight:600}
  .btn.danger{background:none;border:1px solid #6b2b25;color:var(--stop);font-weight:600}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

  #timer{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;
    background:var(--plate2);border:1px solid var(--steel);border-radius:999px;padding:9px 14px;
    font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ash);box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #timer.run{color:var(--signal);border-color:#6b5518}

  .chartwrap{margin:8px 0}
  .chartwrap svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ash);margin-top:4px;flex-wrap:wrap}
  .legend .k{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .note{font-size:13px;color:var(--ash)}
  .divider{border:none;border-top:1px solid var(--steel);margin:16px 0}
  .pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--steel);color:var(--ash)}
  .wu{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .wu span{border:1px solid var(--steel);border-radius:7px;padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ash);background:var(--plate2)}
  .wu span.ind{color:var(--signal);border-color:#6b5518}
  .summit{display:grid;gap:9px;margin:10px 0 4px}
  .srow{display:grid;grid-template-columns:60px 1fr 92px;gap:10px;align-items:center;font-size:13px;color:var(--ash)}
  .sbar{height:6px;border-radius:4px;background:var(--steel);overflow:hidden}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a1c,var(--signal));border-radius:4px}
  .sval{text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk);font-weight:700}
  .stepbtn{width:44px;height:44px;flex:none;border:1px solid var(--steel);border-radius:9px;font-size:19px;font-weight:700;color:var(--chalk);background:var(--plate2)}
  .editrow{display:flex;align-items:center;gap:8px;margin:10px 0}
  .editrow .lbl{width:56px;color:var(--ash);font-size:13px;flex:none}
  .editrow input{flex:1;width:auto;text-align:center;font-size:18px;font-weight:700;padding:9px 6px}
  .todaypill{font-size:11px;color:var(--signal);border:1px solid #6b5518;border-radius:999px;padding:2px 9px;margin-left:8px;letter-spacing:.05em}
  .cycdesc{font-size:12px;color:var(--ash);margin-top:3px}
  #timer.run{animation:tpulse 1.6s ease-in-out infinite}
  @keyframes tpulse{0%,100%{box-shadow:0 4px 18px rgba(0,0,0,.4)}50%{box-shadow:0 4px 24px rgba(255,178,36,.28)}}
  .wkstrip{display:flex;gap:3px;margin-top:7px}
  .wkstrip i{flex:1;height:3px;border-radius:2px;background:var(--steel)}
  .wkstrip i.past{background:#4d5564}
  .wkstrip i.cur{background:var(--signal)}
  .tab svg{width:20px;height:20px;display:block;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pline{display:flex;align-items:center;gap:9px;margin:0 0 4px}
  .pline span{font-size:11.5px;color:var(--ash);font-variant-numeric:tabular-nums;flex:none}
  .pbar{flex:1;height:4px;border-radius:3px;background:var(--steel);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--signal);border-radius:3px;transition:width .25s}
  .pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ash);margin-bottom:6px}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--steel);margin:0 auto 12px}
  .card.single .rx{font-size:28px}
  .card.single .rx b{color:var(--signal);font-weight:800}
  .chip:active,.btn:active,.tab:active{transform:scale(.96)}
  .wavecard.past{opacity:.55}
  .done .eyebrow::after{content:" ✓";color:var(--go)}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<div id="app">
  <header>
    <div class="brand"><h1>Road to <b>3/4/5</b></h1><button class="ibtn" id="rulesbtn" aria-label="Rules">§</button></div>
    <div class="ctx" id="ctxline"></div>
    <div class="wkstrip" id="wkstrip" aria-hidden="true"></div>
  </header>
  <main id="view"></main>
</div>
<button id="timer" aria-label="Rest timer">⏱ rest</button>
<nav><div class="tabs" id="tabs"></div></nav>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
/*==ENGINE==*/
const E = ENGINE;
if (!document.querySelector('meta[name="viewport"]')) {
  const mv = document.createElement("meta"); mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}
function crisp(cv) {
  const d = Math.min(3, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  if (r.width) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
}

/* ── storage ──
   Single-user, on-device data. Everything user-originated (including
   imported backups) is escaped via esc() before touching markup, and
   imports are shape-validated. */
const KEY = "r345.v1";
const DK_RE = /^\d{4}-\d{2}-\d{2}$/;
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.logs = S.logs || {}; S.gates = S.gates || {}; S.bw = S.bw || {}; S.testMax = S.testMax || {}; S.meas = S.meas || {};
S.settings = S.settings || { offsetWeeks: 0 };
S.spec = S.spec || { ...E.DEFAULT_SPEC };
S.ledger = S.ledger || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
// exercise history for log-driven progression: pkey -> [{t,w,r}]
function histIndex() {
  const ix = {};
  for (const [dk, log] of Object.entries(S.logs)) {
    if (!DK_RE.test(dk) || !log.sets) continue;
    const t = Date.parse(dk);
    for (const arr of Object.values(log.sets)) for (const st of arr) {
      if (!st || !st.k) continue;
      (ix[st.k] = ix[st.k] || []).push({ t, w: +st.w || 0, r: +st.r || 0 });
    }
  }
  return ix;
}

const fmt = (ms) => new Date(ms).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const fmtShort = (ms) => new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
function todayUTC() { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
const keyOf = (ms) => new Date(ms).toISOString().slice(0, 10);
let viewDate = todayUTC();
let tab = "today";

/* ── movement library ── */
const MOVES = {
  sq:{name:"Competition Squat",grp:"Main Lifts",arch:"squat",yt:"low bar squat technique powerlifting",
    cues:["Big 360° brace before every rep","Same walkout every time: two steps, set, breathe","Competition depth — hip crease below the knee","Drive mid-foot; knees track the toes"],
    cap:"Singles & back-offs stop at RPE 8. No grinders, ever."},
  bn:{name:"Competition Bench",grp:"Main Lifts",arch:"bench",yt:"competition bench press setup pause",
    cues:["Shoulder blades pinched and down, feet planted","Touch → 1-sec pause → press, every rep","Bar path: low chest to over the shoulders","Wrists stacked over elbows"],
    cap:"Singles & back-offs stop at RPE 8."},
  dl:{name:"Competition Deadlift",grp:"Main Lifts",arch:"hinge",yt:"conventional deadlift setup technique",
    cues:["Reset and re-brace EVERY rep — no touch-and-go","Pull the slack out before the bar breaks","Push the floor away; bar drags the thighs","Lockout is hips through, not lean-back"],
    cap:"Singles & back-offs stop at RPE 8."},
  ps:{name:"Paused Squat",grp:"Main Lifts",arch:"squat",yt:"paused squat 2 second",
    cues:["2-sec motionless pause in the hole","Stay braced and upright through the pause","Dead stop then drive — no sink-and-heave","Never becomes a second heavy squat day"],
    cap:"Capped at its listed RPE (6–7). Usually 60–72% of CB."},
  pb:{name:"Paused Bench",grp:"Main Lifts",arch:"bench",yt:"paused bench press competition",
    cues:["Pause like a meet ref is watching","Identical pause length every rep","Keep tension — don't relax onto the chest"],
    cap:"Capped at listed RPE. Usually 62–75% of CB."},
  ohp:{name:"Overhead Press",grp:"Main Lifts",arch:"ohp",yt:"overhead press technique strict",
    cues:["Squeeze glutes, ribs down — no excessive lean-back","Bar finishes over the ears","3×6 → add reps to 3×8 clean → +5 lb → back to 3×6"],
    cap:"RPE 7–8. Never to failure. Only 2 sets in Week 3."},
  legpress:{name:"Leg Press",grp:"Legs",arch:"legpress",yt:"leg press form",
    cues:["Set the safety stops BEFORE loading","Full controlled range, knees track toes","Lower slow, drive without slamming the sled"],
    cap:"Final set → controlled technical failure, Weeks 1–2 only."},
  seatcurl:{name:"Seated Leg Curl",grp:"Legs",arch:"legcurl",yt:"seated leg curl",
    cues:["Back stays pinned to the pad","3-sec negative earns the next weight jump"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  lyingcurl:{name:"Lying Leg Curl",grp:"Legs",arch:"legcurl",yt:"lying leg curl form",
    cues:["Hips pinned down — no butt lift","Control the eccentric all the way"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  legext:{name:"Leg Extension",grp:"Legs",arch:"legext",yt:"leg extension form",
    cues:["1-sec pause at the top","No slamming the stack on the way down"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  calf:{name:"Standing Calf Raise",grp:"Legs",arch:"calf",yt:"standing calf raise full range",
    cues:["Full stretch at the bottom — pause there","Big-toe drive to a tall top"],cap:"No bouncing. Smooth reps only."},
  hlr:{name:"Hanging Leg Raise",grp:"Trunk & Grip",arch:"hlr",yt:"hanging leg raise strict",
    cues:["Dead hang, ribs down, zero swing","Curl the pelvis — the legs just come along","Progress with stricter form, then a light DB"],cap:"Stop when form breaks — swinging reps don't count."},
  rowtue:{name:"Chest-Supported DB Row",grp:"Press & Pull",arch:"row",yt:"chest supported dumbbell row",
    cues:["Chest glued to the pad — zero body English","Elbow to hip, 1-sec squeeze","Full stretch at the bottom"],cap:"Strict only. No unsupported barbell rows in this program."},
  rowfri:{name:"Chest-Supported DB Row",grp:"Press & Pull",arch:"row",yt:"chest supported dumbbell row",
    cues:["Chest glued to the pad — zero body English","Elbow to hip, 1-sec squeeze"],cap:"Strict only."},
  incline:{name:"Incline DB Press",grp:"Press & Pull",arch:"incpress",yt:"incline dumbbell press form",
    cues:["30–45° bench, DBs finish over the shoulders","Elbows about 45° from the torso"],cap:"RPE 8 cap — it assists bench, never competes with it."},
  pulldown:{name:"Wide-Grip Lat Pulldown",grp:"Press & Pull",arch:"pulldown",yt:"wide grip lat pulldown technique",
    cues:["Wide grip, chest up to the bar","Elbows drive down to the hips, not back","Straps welcome — lats are the target, not grip","5 sets now: width is the priority"],cap:"RPE 8–9."},
  pullover:{name:"Machine Pullover",grp:"Press & Pull",arch:"pulldown",yt:"machine pullover lats",
    cues:["Arms stay long — pure shoulder extension","Full stretch overhead, squeeze to the hips","The best width builder: biceps can't fail first","No machine? Straight-arm cable pulldown"],cap:"RPE 8–9. The #1 V-taper movement."},
  lowhigh:{name:"Low-to-High Cable Fly",grp:"Press & Pull",arch:"rearfly",yt:"low to high cable fly upper chest",
    cues:["Pulleys at the bottom, sweep up and in","Hands finish at collarbone height","Squeeze a beat at the top","Builds the upper-chest shelf flat pressing misses"],cap:"RPE 8–9."},
  facepull:{name:"Face Pull",grp:"Arms & Delts",arch:"rearfly",yt:"face pull rope technique",
    cues:["Rope to the forehead, elbows high","External rotation at the end — show your biceps","Rear delts AND posture — posture changes your silhouette"],cap:"RPE 8–9. Light and strict."},
  seatcalf:{name:"Seated Calf Raise",grp:"Legs",arch:"calf",yt:"seated calf raise soleus",
    cues:["Bent knee targets the soleus (straight-leg hits gastroc)","Full stretch at the bottom, pause there","Slow — no bouncing off the tendon"],cap:"RPE 8–9."},
  lattue:{name:"Lateral Raise",grp:"Arms & Delts",arch:"lateral",yt:"dumbbell lateral raise form",
    cues:["Lead with the elbow","Stop shy of a shrug — traps stay quiet","If it needs momentum, it's too heavy"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  latwed:{name:"Lateral Raise (high-rep)",grp:"Arms & Delts",arch:"lateral",yt:"lateral raise high reps",
    cues:["15–25 reps — chase the burn, not the load","Perfect reps only, even at rep 22"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  latthu:{name:"Lateral Raise (4 sets)",grp:"Arms & Delts",arch:"lateral",yt:"lateral raise form",
    cues:["The big side-delt day — 4 sets","Lead with the elbow, quiet traps"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  rdf:{name:"Rear-Delt Fly",grp:"Arms & Delts",arch:"rearfly",yt:"rear delt fly dumbbell",
    cues:["Arms long, sweep OUT not back","Zero momentum, 1-sec squeeze"],cap:"Light and strict beats heavy and sloppy."},
  revpec:{name:"Reverse Pec Deck",grp:"Arms & Delts",arch:"rearfly",yt:"reverse pec deck",
    cues:["Arms long, sweep out","Squeeze a second at the back"],cap:"15–25 rep range — pump work."},
  inccurl:{name:"Incline DB Curl",grp:"Arms & Delts",arch:"curl",yt:"incline dumbbell curl",
    cues:["45° bench, arms hang behind — full stretch","Curl without shoulders creeping forward","THE priority curl — always first"],cap:"Final set RPE 9–10 OK in Weeks 1–2."},
  ezcurl:{name:"EZ-Bar Curl",grp:"Arms & Delts",arch:"curl",yt:"ez bar curl form",
    cues:["Elbows pinned to your sides","Full extension every rep — halves don't count"],cap:"RPE 8–9; first to drop if elbows flare (pain ladder)."},
  hammer:{name:"Hammer Curl",grp:"Arms & Delts",arch:"curl",yt:"hammer curl",
    cues:["Neutral grip, slow negative","The elbow-friendly curl"],cap:"RPE 8–9."},
  cablecurl:{name:"Cable Curl",grp:"Arms & Delts",arch:"curl",yt:"cable curl form",
    cues:["Constant tension — no resting at the bottom","Strict; step back from the stack"],cap:"RPE 8–9."},

let animId = null;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawFrame(cv, arch, k, opts) { paintScene(cv, arch, k, opts); }
function animate(cv, arch, opts) {
  stopAnim(); crisp(cv);
  if (REDUCED) { drawFrame(cv, arch, 0.8, opts); return; }
  const t0 = performance.now();
  const loop = (now) => {
    drawFrame(cv, arch, phase(((now - t0) / 3000) % 1), opts);
    animId = requestAnimationFrame(loop);
  };
  animId = requestAnimationFrame(loop);
}
function stopAnim() { if (animId) cancelAnimationFrame(animId); animId = null; }

let tEnd = null, tInt = null;
const timerBtn = $("#timer");
function tickTimer() {
  if (!tEnd) return;
  const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  timerBtn.textContent = `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  if (left <= 0) { clearInterval(tInt); tEnd = null; timerBtn.classList.remove("run"); timerBtn.textContent = "⏱ done!"; if (navigator.vibrate) navigator.vibrate([160, 90, 160]); setTimeout(() => { if (!tEnd) timerBtn.textContent = "⏱ rest"; }, 20000); }
}
timerBtn.addEventListener("click", () => {

});
window.startTimer = (s) => { tEnd = Date.now() + s * 1000; clearInterval(tInt); tInt = setInterval(tickTimer, 500); timerBtn.classList.add("run"); tickTimer(); closeSheet(); };

function renderRoad() {
  const off = S.settings.offsetWeeks || 0;
  const now = E.whereIs(todayUTC(), off);
  const cbNow = E.cbFor(Math.max(1, Math.min(now.wave || 1, 19)), S.gates);
  const GOALS = { bn: [225, 315], sq: [315, 405], dl: [405, 495] };
  const bwRows = Object.entries(S.bw).filter(([k]) => DK_RE.test(k)).sort();
  const bwNow = bwRows.length ? bwRows[bwRows.length - 1][1] : 182;
  const bwPct = Math.max(0, Math.min(100, Math.round(((bwNow - 182) / (200 - 182)) * 100)));
  let h = `<div class="card single"><div class="eyebrow sig">The Goal — 315/405/495 · 200 @ 15%</div><div class="summit">
    ${E.LIFTS.map((L) => { const [s0, g] = GOALS[L]; const pct = Math.max(0, Math.min(100, Math.round(((cbNow[L] - s0) / (g - s0)) * 100))); return `<div class="srow"><span>${E.LIFT_NAME[L]}</span><div class="sbar"><i style="width:${pct}%"></i></div><span class="sval">${cbNow[L]} / ${g}</span></div>`; }).join("")}
    ${["inc", "chin", "rdl"].map((id) => {
        const T = E.TRACKED[id], v = E.trackedCB(id, Math.max(1, Math.min(now.wave || 1, 19)), S.gates);
        const p = Math.max(0, Math.min(100, Math.round(((v - T.start) / (T.goal - T.start)) * 100)));
        const lbl = { inc: "Incline", chin: "Chin-up", rdl: "RDL" }[id];
        const f = (x) => (T.added ? "+" + x : x);
        return `<div class="srow"><span>${lbl}</span><div class="sbar"><i style="width:${p}%"></i></div><span class="sval">${f(v)} / ${f(T.goal)}</span></div>`;
      }).join("")}
    <div class="srow" style="border-top:1px solid var(--steel);padding-top:8px"><span>Bodyweight</span><div class="sbar"><i style="width:${bwPct}%"></i></div><span class="sval">${bwNow} / 200</span></div>
  </div><p class="note">Lifts are cycle bases, not tested maxes. Incline, chin-up and RDL are tracked the same way the big three are — arms and hamstrings are goals, not accessories. Bodyweight only counts if the waist stays flat while it climbs.</p></div>
  <p class="note">19 waves · 4 macros. Projections re-compute from your gate results; untouched gates assume clean.</p>`;
  for (let w = 1; w <= 19; w++) {
    const cb = E.cbFor(w, S.gates);
    const cyc = E.cycleOf(w);
    const t = E.mainTables(w, S.gates).t;
    const start = E.waveStartUTC(w, off);
    const cur = now.wave === w;
    const past = now.wave > w;
    const g = S.gates[w] || {};

function svgChart(pts, opts = {}) {
  const W = 520, H = 170, P = 34;
  if (!pts.length) return `<p class="note">${opts.empty || "Nothing logged yet — this chart grows as you train."}</p>`;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y).concat(opts.extraY || []);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max((y1 - y0) * 0.15, 2); y0 -= pad; y1 += pad;
  const X = (v) => P + ((v - x0) / (x1 - x0)) * (W - P - 10);
  const Y = (v) => H - 22 - ((v - y0) / (y1 - y0)) * (H - 34);
  let g = "";
  for (let i = 0; i <= 3; i++) { const yy = 12 + (i * (H - 34)) / 3; g += `<line x1="${P}" y1="${yy}" x2="${W - 10}" y2="${yy}" stroke="#232830"/>`; }
  let band = "";
  if (opts.band) {
    const b = opts.band.filter((p) => p.x >= x0 && p.x <= x1);
    if (b.length > 1) band = `<path d="M${b.map((p) => `${X(p.x)},${Y(p.lo)}`).join(" L")} L${[...b].reverse().map((p) => `${X(p.x)},${Y(p.hi)}`).join(" L")} Z" fill="rgba(255,178,36,.10)"/>`;
  }
  const line = (arr, color, dash) => arr.length > 1 ? `<path d="M${arr.map((p) => `${X(p.x)},${Y(p.y)}`).join(" L")}" fill="none" stroke="${color}" stroke-width="2.4" ${dash ? 'stroke-dasharray="5 4"' : ""}/>` : "";
  const dots = (arr, color) => arr.map((p) => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6" fill="${color}"/>`).join("");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${band}
    ${opts.line2 ? line(opts.line2, "#8b919c", true) : ""}
    ${line(pts, "#e9e7e1")}${dots(pts, "#e9e7e1")}
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4.5" fill="#ffb224"/>
    <text x="${P - 5}" y="${Y(y1 - pad) + 4}" fill="#8b919c" font-size="11" text-anchor="end">${Math.round(y1 - pad)}</text>
    <text x="${P - 5}" y="${Y(y0 + pad) + 4}" fill="#8b919c" font-size="11" text-anchor="end">${Math.round(y0 + pad)}</text>
    <text x="${X(last.x)}" y="${Y(last.y) - 9}" fill="#ffb224" font-size="12" font-weight="700" text-anchor="middle">${last.y}</text>
    <text x="${P}" y="${H - 6}" fill="#5d6470" font-size="10.5">${fmtShort(x0)}</text>
    <text x="${W - 10}" y="${H - 6}" fill="#5d6470" font-size="10.5" text-anchor="end">${fmtShort(x1)}</text></svg>`;
}

      <div class="legend"><span><span class="k" style="background:#e9e7e1"></span>morning weigh-ins</span><span><span class="k" style="background:rgba(255,178,36,.5)"></span>on-pace band (0.25–0.5 lb/wk)</span></div>
      ${wkAvg.length ? `<div class="tablewrap" style="margin-top:10px"><table><tr><th>Week of</th><th>Avg</th><th>Δ</th><th>Call</th></tr>${wkAvg.map((r) => `<tr><td>${r.wk}</td><td>${r.avg}</td><td>${r.d === null ? "—" : (r.d > 0 ? "+" : "") + r.d}</td><td class="note">${r.call}</td></tr>`).join("")}</table></div>` : ""}
      <p class="note" style="margin-top:8px">Gain mode: 3,050 cal · P 190 · +0.25 lb/wk. Trim only at ~18% BF (4–6 wks, stop at 15%). Goal: <b style="color:var(--chalk)">200 @ 15%</b> ≈ 170 lb lean.</p></div>
    <div class="card"><div class="eyebrow sig">Strength</div>
      <div class="seg">${E.LIFTS.map((L) => `<button class="y ${trendLift === L ? "on" : ""}" onclick="trendLift='${L}';render()">${E.LIFT_NAME[L]}</button>`).join("")}</div>
      <div class="chartwrap">${svgChart(tops, { line2: e1s, empty: "Log sets on a " + E.LIFT_NAME[trendLift] + " day to start this chart." })}</div>
      <div class="legend"><span><span class="k" style="background:#e9e7e1"></span>heaviest set that day</span><span><span class="k" style="background:#8b919c"></span>est. 1RM (Epley)</span></div></div>
    <div class="card"><div class="eyebrow">All-time bests (logged)</div>
      ${prs.map((p) => `<div class="lset"><span>${E.LIFT_NAME[p.L]}</span><span class="x" style="color:var(--chalk);font-weight:700">${p.best ? esc(String(p.best.w)) + " · " + esc(p.best.dk) : "—"}</span></div>`).join("")}
      <p class="note" style="margin-top:6px">North Star 315 / 405 / 495 · Dec checkpoint 235–245 / 315–335 / 405–425</p></div>`;
}
function weeklyAverages(n) {
  const out = []; const t = todayUTC();
  for (let i = 0; i < n; i++) {
    const end = t - i * 7 * E.MS_DAY, start = end - 6 * E.MS_DAY;
    const vals = [];
    for (let d = start; d <= end; d += E.MS_DAY) { const v = S.bw[keyOf(d)]; if (Number.isFinite(v)) vals.push(v); }
    if (!vals.length) continue;
    const avg = Math.round((vals.reduce((a, b) => a + b) / vals.length) * 10) / 10;
    out.unshift({ wk: fmtShort(start), avg, d: null, call: "" });
  }
  for (let i = 1; i < out.length; i++) out[i].d = Math.round((out[i].avg - out[i - 1].avg) * 10) / 10;
  for (let i = 0; i < out.length; i++) {
    const d = out[i].d;
    out[i].call = d === null ? "" : d <= 0 ? "flat — 2 wks flat → +150 cal" : d > 0.75 ? "hot → −100–150 cal" : "on pace";
  }
  return out.slice(-4);
}

/* ── MORE ── */
function renderMore() {
  const logged = Object.keys(S.logs).filter((k) => DK_RE.test(k) && S.logs[k].sets && Object.keys(S.logs[k].sets).length).sort().reverse();
  $("#view").innerHTML = `
    <div class="card"><div class="eyebrow sig">History</div>
      ${logged.length ? logged.slice(0, 40).map((dk) => { const loc = E.whereIs(Date.parse(dk), S.settings.offsetWeeks || 0); return `<div class="lset"><span>${esc(dk)} · W${loc.wave}·wk${loc.week}·d${loc.day}${S.logs[dk].r ? " · " + esc(S.logs[dk].r) : ""}</span><button class="x" onclick="delDay('${esc(dk)}')">✕</button></div>`; }).join("") : `<p class="note">No sessions logged yet. They'll pile up here.</p>`}</div>
    <div class="card"><div class="eyebrow sig">Weekend specialization</div>
      <p class="note">Sat = frame overload · Sun = optional detail. Focus: <b style="color:var(--chalk)">${esc(E.FRAME_LABEL[S.spec.framePrimary])}</b> + <b style="color:var(--chalk)">${esc(E.DETAIL_LABEL[S.spec.detail])}</b>.</p>
      <div class="rowbtns"><button class="btn" onclick="specSheet()">⚙ Configure</button><button class="btn ghost" onclick="ledgerSheet()">📒 Ledger</button></div></div>
    <div class="card"><div class="eyebrow sig">Data</div>
      <p class="note">Logs live in THIS browser only. Export after every test day and keep the file safe.</p>
      <div class="rowbtns"><button class="btn" onclick="exportData()">Export backup</button>
      <button class="btn ghost" onclick="importSheet()">Import</button></div></div>
    <div class="card"><div class="eyebrow sig">Settings</div>
      <label class="note">Schedule shift (weeks) — for mini-cuts or life: <input type="number" value="${S.settings.offsetWeeks || 0}" onchange="S.settings.offsetWeeks=+this.value||0;save();render()"></label>
      <div class="rowbtns"><button class="btn danger" onclick="if(confirm('Erase ALL logs, gates and settings?')){localStorage.removeItem(KEY);location.reload()}">Erase everything</button></div></div>
    <div class="card"><div class="eyebrow">Companion pieces</div>
      <p class="note">📓 Wave notes + 🍚 nutrition plan → Apple Notes · 📅 sessions 7:00–8:30 → Apple Calendar · this app → logging, projections, demos.</p></div>`;
}
window.logMeas = () => {
  const wa = parseFloat(document.getElementById("mw").value);
  const sh = parseFloat(document.getElementById("ms").value);
  if (!Number.isFinite(wa) && !Number.isFinite(sh)) return;
  const k = keyOf(todayUTC());
  S.meas[k] = S.meas[k] || {};
  if (Number.isFinite(wa)) S.meas[k].wa = wa;
  if (Number.isFinite(sh)) S.meas[k].sh = sh;
  save(); render();
};
window.delDay = (dk) => { if (confirm("Delete this session log?")) { delete S.logs[dk]; save(); render(); } };
window.exportData = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `road345-backup-${keyOf(todayUTC())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
window.importSheet = () => {
  openSheet(`<button class="closex" onclick="closeSheet()">×</button><h2>Import backup</h2>
    <p class="note">Paste a backup JSON below. Replaces everything here.</p>
    <textarea id="imp" rows="6" style="width:100%"></textarea>
    <div class="rowbtns"><button class="btn" onclick="doImport()">Import</button></div>`);
};
window.doImport = () => {
  try {
    const d = JSON.parse($("#imp").value);
    if (typeof d !== "object" || !d.logs || typeof d.logs !== "object") throw 0;
    for (const k of Object.keys(d.logs)) if (!DK_RE.test(k)) delete d.logs[k];
    if (d.bw) for (const k of Object.keys(d.bw)) if (!DK_RE.test(k) || !Number.isFinite(d.bw[k])) delete d.bw[k];
    S = d; S.logs = S.logs || {}; S.gates = S.gates || {}; S.bw = S.bw || {}; S.testMax = S.testMax || {}; S.meas = S.meas || {};
    S.settings = S.settings || { offsetWeeks: 0 };
    S.spec = S.spec || { ...E.DEFAULT_SPEC }; S.ledger = S.ledger || {};
    save(); closeSheet(); render();
  } catch (e) { alert("That doesn't look like a Road-to-3/4/5 backup."); }
};

/* ── rules sheet ── */
$("#rulesbtn").addEventListener("click", () => openSheet(`<button class="closex" onclick="closeSheet()">×</button>
  <h2>The Rules</h2>
  <div class="eyebrow sig">RPE</div>
  <p class="note">6 = 4 left · 7 = 3 left · 8 = 2 left · 9 = 1 left · 10 = nothing clean left. Mains STOP at 8.</p>
  <div class="eyebrow sig" style="margin-top:10px">🟡 Yellow — 5.5–7 h sleep, hard shift, slow warm-ups, mild joint noise, prior flat session</div>
  <p class="note">Single caps at RPE 7 · back-offs −5% OR −1 set · 2 sets per accessory · skip cardio. The app applies the numbers when you tap Yellow.</p>
  <div class="eyebrow sig" style="margin-top:10px">🔴 Red — &lt;5.5 h + stress, illness, sharp pain, 2 flat sessions</div>
  <p class="note">No single. Main 3×3 @ 60%. 1–2 easy accessories, out in 30–45 min. Sharp, radiating or worsening pain → rest and get it evaluated.</p>
  <div class="eyebrow sig" style="margin-top:10px">Flat session (2+ boxes = flat)</div>
  <p class="note">Single 1+ RPE too hard · back-offs miss the cap · technique degrading across sets · bar speed clearly down · multiple exercises declining · focus gone. One flat → next related session Yellow. Two → Full Deload.</p>
  <div class="eyebrow sig" style="margin-top:10px">Gate (end of every wave, per lift)</div>
  <p class="note">Wk3 single ≤8 + back-offs inside cap + technique stable + 3 normal weeks → clean bump (+5 bench / +10 squat·dead). At the ceiling → small. Inconsistent → repeat. Two stalls → −5% and rebuild.</p>
  <div class="eyebrow sig" style="margin-top:10px">The last set is the one that grows you</div>
  <p class="note">On safe machine/cable/DB isolations in Weeks 1–2, the final set carries a <b style="color:var(--signal)">→9–10</b> marker: take it to 1 rep shy of failure, or failure. Proximity to failure is the strongest remaining lever on hypertrophy, and isolations are where it costs you almost nothing. Compounds still stop at 8. Week 3, deloads and peaks never push.</p>
  <div class="eyebrow sig" style="margin-top:10px">Log-driven accessories</div>
  <p class="note">Accessory weights advance only when your logged sets clear the TOP of the rep range on 2+ sets at (or above) the prescribed weight. Miss it → the app holds the rung. Log heavier and clear it → the app adopts your weight. Unlogged exercises follow the schedule.</p>
  <div class="eyebrow sig" style="margin-top:10px">Priorities</div>
  <p class="note">1 Health &amp; sleep · 2 School · 3 Work · 4 Comp lifts · 5 Required hypertrophy · 6 Optional pump.<br>Consistency &gt; intensity theater. Peak by removing fatigue, not proving fitness.</p>`));

/* ── router ── */
const CYCLE_DESC = { 1: "Learn accurate RPEs — add nothing", 2: "Same wave, more weight — add nothing", 3: "Accessory payoff · optional +2 sets, ONE lagging area", 4: "Competition-strict singles · reliable beats heavy", 5: "Singles climb, back-offs become doubles & triples", 6: "Peak: openers → taper → TEST Friday" };
const TABS = [["today", "Today"], ["road", "Road"], ["moves", "Moves"], ["trends", "Trends"], ["more", "More"]];
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/></svg>',
  road: '<svg viewBox="0 0 24 24"><path d="M5 20.5c7 0 3.5-6.5 7.5-8.5s5.5-3.5 5.5-8.5"/><circle cx="18" cy="3.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="20.5" r="1.4" fill="currentColor" stroke="none"/></svg>',
  moves: '<svg viewBox="0 0 24 24"><circle cx="12" cy="4.8" r="2.1"/><path d="M12 7.5v6.2M12 9.2l-5.2 2.3M12 9.2l5.2-1.2M12 13.7l-3.6 6.8M12 13.7l3.6 6.8"/></svg>',
  trends: '<svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 15l4.5-5 3.5 3 5.5-7"/><circle cx="18.5" cy="6" r="1.5" fill="currentColor" stroke="none"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
};
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) => `<button class="tab ${tab === id ? "on" : ""}" onclick="goTab('${id}')">${ICONS[id]}${label}</button>`).join("");
}
window.goTab = (id) => {
  tab = id; render(); window.scrollTo(0, 0);
  if (id === "road") setTimeout(() => { const el = document.querySelector(".wavecard.now"); if (el) el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); }, 60);
};
function render() {
  renderTabs(); stopAnim();
  const off = S.settings.offsetWeeks || 0;
  const loc = E.whereIs(todayUTC(), off);
  const ws = $("#wkstrip");
  if (loc.pre || loc.wave > 19) ws.innerHTML = "";
  else ws.innerHTML = [1, 2, 3, 4].map((w) => `<i class="${w < loc.week ? "past" : w === loc.week ? "cur" : ""}"></i>`).join("");
  $("#ctxline").innerHTML = loc.pre ? "Wave 1 begins Mon Jul 20, 2026"
    : loc.wave > 19 ? "Beyond Wave 19 — ask for the next map"
    : `Wave ${loc.wave} · Week ${loc.week} · ${E.CYCLE_NAME[E.cycleOf(loc.wave)]} · CB <b>${E.cbFor(loc.wave, S.gates).bn}/${E.cbFor(loc.wave, S.gates).sq}/${E.cbFor(loc.wave, S.gates).dl}</b>`;
  ({ today: renderToday, road: renderRoad, moves: renderMoves, trends: renderTrends, more: renderMore })[tab]();
}
window.closeSheet = closeSheet; window.moveSheet = moveSheet;
render();
</script>
