<body>
<style>
  :root{
    --iron:#101216; --plate:#1a1e24; --plate2:#20252d; --steel:#2a303a;
    --chalk:#e9e7e1; --ash:#8b919c; --signal:#ffb224;
    --go:#46b073; --stop:#e4574b;
    --disp:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Arial Narrow',sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--iron);color:var(--chalk);font-family:var(--body);line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  #app{max-width:560px;margin:0 auto;padding:0 14px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--chalk);background:var(--iron);
    border:1px solid var(--steel);border-radius:8px;padding:6px 8px}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  input[type=number]{width:66px;text-align:center;font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--iron) 82%,rgba(16,18,22,0));
    padding:9px 0 7px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
  .brand h1 b{color:var(--signal);font-weight:700}
  .ctx{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--ash)}
  .ctx b{color:var(--chalk)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,23,29,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--steel);
    padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;
    color:var(--ash);padding:10px 2px 8px;border-radius:8px;text-align:center}
  .tab.on{color:var(--signal);background:rgba(255,178,36,.09)}

  .card{background:var(--plate);border:1px solid var(--steel);border-radius:12px;padding:11px 12px 9px;margin:8px 0}
  .card.single{background:linear-gradient(160deg,#232019 0%,var(--plate) 55%);border-color:#4a3d1d}
  .eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;color:var(--ash);margin-bottom:2px}
  .eyebrow.sig{color:var(--signal)}
  .rx{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .rx small{font-size:14px;font-weight:600;color:var(--ash);letter-spacing:0}
  .capnote{font-size:12.5px;color:var(--ash);margin-top:2px}
  .capnote b{color:var(--chalk)}
  .warn{color:var(--signal)}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ibtn{color:var(--ash);border:1px solid var(--steel);border-radius:999px;width:34px;height:34px;
    font-size:15px;line-height:1;flex:none}
  .done .rx{color:var(--go)}

  .setrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{min-width:52px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:9px;border:1px solid var(--steel);
    background:var(--plate2);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ash)}
  .chip.hit{background:rgba(70,176,115,.14);border-color:#2c5c42;color:var(--go)}
  .chip.add{color:var(--signal);border-style:dashed}
  .chip.hard{border-color:#6b5518;color:var(--signal)}
  .chip.hard small{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.85}
  .lset{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0}
  .lset .x{color:var(--ash);margin-left:auto;padding:4px 8px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
  .seg button{padding:10px 4px;border-radius:9px;border:1px solid var(--steel);font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ash)}
  .seg .g.on{background:rgba(70,176,115,.15);border-color:#2c5c42;color:var(--go)}
  .seg .y.on{background:rgba(255,178,36,.13);border-color:#6b5518;color:var(--signal)}
  .seg .r.on{background:rgba(228,87,75,.13);border-color:#6b2b25;color:var(--stop)}

  .daynav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .daynav button{font-size:20px;color:var(--ash);padding:4px 14px}
  .daynav .dt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--chalk)}
  .metrics{display:flex;gap:10px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ash);
    text-align:left;padding:5px 6px;border-bottom:1px solid var(--steel)}
  td{padding:6px;border-bottom:1px solid #232830}
  .tablewrap{overflow-x:auto}

  .wavecard{display:block;width:100%;text-align:left}
  .wavecard .cbline{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .wavecard.now{border-color:#6b5518;background:linear-gradient(160deg,#242017 0%,var(--plate) 60%)}
  .wavecard.done19{border-color:#2c5c42}
  .gatechip{display:inline-block;font-size:11px;border:1px solid var(--steel);border-radius:999px;

  .grp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--signal);
    margin:18px 0 2px}

  .btn{display:inline-block;background:var(--signal);color:#1b1405;font-weight:700;border-radius:9px;

  .btn.ghost{background:none;border:1px solid var(--steel);color:var(--chalk);font-weight:600}
  .btn.danger{background:none;border:1px solid #6b2b25;color:var(--stop);font-weight:600}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

  .chartwrap{margin:8px 0}
  .chartwrap svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ash);margin-top:4px;flex-wrap:wrap}
  .legend .k{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .note{font-size:13px;color:var(--ash)}
  .divider{border:none;border-top:1px solid var(--steel);margin:16px 0}
  .pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--steel);color:var(--ash)}
  .wu{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}

  .summit{display:grid;gap:9px;margin:10px 0 4px}
  .srow{display:grid;grid-template-columns:60px 1fr 92px;gap:10px;align-items:center;font-size:13px;color:var(--ash)}
  .sbar{height:6px;border-radius:4px;background:var(--steel);overflow:hidden}

  .sval{text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk);font-weight:700}
  .stepbtn{width:44px;height:44px;flex:none;border:1px solid var(--steel);border-radius:9px;font-size:19px;font-weight:700;color:var(--chalk);background:var(--plate2)}
  .editrow{display:flex;align-items:center;gap:8px;margin:10px 0}
  .editrow .lbl{width:56px;color:var(--ash);font-size:13px;flex:none}
  .editrow input{flex:1;width:auto;text-align:center;font-size:18px;font-weight:700;padding:9px 6px}
  .todaypill{font-size:11px;color:var(--signal);border:1px solid #6b5518;border-radius:999px;padding:2px 9px;margin-left:8px;letter-spacing:.05em}
  .cycdesc{font-size:12px;color:var(--ash);margin-top:3px}

  .wkstrip{display:flex;gap:3px;margin-top:7px}
  .wkstrip i{flex:1;height:3px;border-radius:2px;background:var(--steel)}
  .wkstrip i.past{background:#4d5564}
  .wkstrip i.cur{background:var(--signal)}
  .tab svg{width:20px;height:20px;display:block;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pline{display:flex;align-items:center;gap:9px;margin:0 0 4px}
  .pline span{font-size:11.5px;color:var(--ash);font-variant-numeric:tabular-nums;flex:none}
  .pbar{flex:1;height:4px;border-radius:3px;background:var(--steel);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--signal);border-radius:3px;transition:width .25s}
  .pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ash);margin-bottom:6px}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--steel);margin:0 auto 12px}
  .card.single .rx{font-size:28px}
  .card.single .rx b{color:var(--signal);font-weight:800}
  .chip:active,.btn:active,.tab:active{transform:scale(.96)}
  .wavecard.past{opacity:.55}
  .done .eyebrow::after{content:" ✓";color:var(--go)}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

<script>
// ── Road to 3/4/5 · progression engine ─────────────────────────────
// Implements Powerlifting + Juicy Arms v7. Waves 1–4 mains are the
// published notes verbatim; waves 5–19 are generated from the v7 rules
// and re-computed from logged gate results.

const R5 = (x) => Math.round(x / 5) * 5;
const R25 = (x) => Math.round(x / 2.5) * 2.5;

const START = { bn: 225, sq: 315, dl: 405 };
const WAVE1_MONDAY = Date.UTC(2026, 6, 20); // 2026-07-20
const MS_DAY = 86400000;
const LIFTS = ["sq", "bn", "dl"];
const LIFT_NAME = { sq: "Squat", bn: "Bench", dl: "Deadlift" };

// gate result → CB delta
function gateDelta(lift, result, prevCB) {
  if (result === "small") return lift === "bn" ? 2.5 : 5;
  if (result === "repeat") return 0;
  if (result === "reset") return R5(prevCB * 0.95) - prevCB;
  return lift === "bn" ? 5 : 10; // clean (default)
}

// gates: {2:{sq:'clean'|'small'|'repeat'|'reset',...}, ...} keyed by the wave the gate FEEDS INTO
function cbFor(wave, gates = {}) {
  const cb = { ...START };
  for (let w = 2; w <= wave; w++) {
    const g = gates[w] || {};
    for (const L of LIFTS) {
      if (g.cb && Number.isFinite(g.cb[L])) cb[L] = g.cb[L]; // explicit CB (e.g. set from a test day)
      else cb[L] = cb[L] + gateDelta(L, g[L] || "clean", cb[L]);
    }
  }
  return cb;
}

const cycleOf = (wave) => ((wave - 1) % 6) + 1;
const macroOf = (wave) => Math.floor((wave - 1) / 6) + 1;
const CYCLE_NAME = ["", "Calibration", "Build", "Accumulate", "Specificity", "Intensification", "Peak"];

// ── schedule ────────────────────────────────────────────────────────
function waveStartUTC(wave, offsetWeeks = 0) {
  return WAVE1_MONDAY + ((wave - 1) * 28 + offsetWeeks * 7) * MS_DAY;
}
// date (ms UTC midnight) → {wave, week, day} · day 1–5 = Mon–Fri, 0 = weekend
function whereIs(utcMid, offsetWeeks = 0) {
  const d = Math.floor((utcMid - WAVE1_MONDAY) / MS_DAY) - offsetWeeks * 7;
  if (d < 0) return { wave: 0, week: 0, day: 0, pre: true };
  const wave = Math.floor(d / 28) + 1;
  const week = Math.floor((d % 28) / 7) + 1;
  const dow = d % 7; // 0=Mon … 6=Sun
  return { wave, week, day: dow + 1, dow }; // 7-day week: 1=Mon Squat … 6=Sat Spec, 7=Sun optional
}

// ── explicit waves 1–4 (the published notes, verbatim) ──────────────
// singles[wk1,wk2,wk3] · back-offs [[w,reps,sets]×3] · wk4 light triple
const NOTES = {
  1: {
    sq: { s: [265, 275, 285], b: [[225, 5, 4], [235, 4, 5], [250, 3, 5]], l: 205 },
    bn: { s: [190, 195, 200], b: [[160, 5, 5], [170, 4, 5], [180, 3, 6]], l: 145 },
    dl: { s: [340, 355, 365], b: [[285, 5, 3], [300, 4, 4], [320, 3, 4]], l: 265 },
    ps: [195, 205, 220, 175], pb: [145, 155, 165, 125],
    ohp: [[95, 6, 3], [95, 7, 3], [95, 8, 2], [75, 6, 2]],
    yellow: [[215, 150, 185, 140, 270], [225, 160, 195, 145, 285], [240, 170, 210, 155, 305]],
    red: [190, 135, 245], deload: { m: [175, 125, 225], ps: 165, pb: 115 }, bridge: null,
  },
  2: {
    sq: { s: [275, 285, 295], b: [[235, 5, 4], [245, 4, 5], [260, 3, 5]], l: 210 },
    bn: { s: [195, 200, 205], b: [[165, 5, 5], [175, 4, 5], [185, 3, 6]], l: 150 },
    dl: { s: [350, 365, 375], b: [[295, 5, 3], [310, 4, 4], [330, 3, 4]], l: 270 },
    ps: [205, 215, 230, 185], pb: [150, 160, 170, 130],
    ohp: [[95, 8, 3], [100, 6, 3], [100, 7, 2], [80, 6, 2]],
    yellow: [[225, 155, 195, 145, 280], [235, 165, 205, 150, 295], [245, 175, 220, 160, 315]],
    red: [195, 140, 250], deload: { m: [180, 125, 230], ps: 170, pb: 120 }, bridge: null,
  },
  3: {
    sq: { s: [285, 295, 305], b: [[245, 5, 4], [255, 4, 5], [270, 3, 5]], l: 220 },
    bn: { s: [200, 205, 210], b: [[170, 5, 5], [180, 4, 5], [190, 3, 6]], l: 155 },
    dl: { s: [360, 375, 385], b: [[305, 5, 3], [320, 4, 4], [340, 3, 4]], l: 275 },
    ps: [215, 225, 240, 195], pb: [155, 165, 175, 135],
    ohp: [[100, 7, 3], [100, 8, 3], [105, 6, 2], [80, 6, 2]],
    yellow: [[235, 160, 205, 145, 290], [240, 170, 215, 155, 305], [255, 180, 230, 165, 325]],
    red: [200, 140, 255], deload: { m: [185, 130, 235], ps: 175, pb: 120 }, bridge: { sq: 255, bn: 185, dl: 345 },
  },
  4: {
    sq: { s: [290, 300, 310], b: [[255, 5, 4], [265, 4, 5], [275, 3, 5]], l: 225 },
    bn: { s: [205, 210, 215], b: [[175, 5, 5], [185, 4, 5], [195, 3, 6]], l: 155 },
    dl: { s: [370, 380, 395], b: [[310, 5, 3], [330, 4, 4], [345, 3, 4]], l: 285 },
    ps: [225, 235, 245, 200], pb: [160, 170, 180, 140],
    ohp: [[105, 6, 3], [105, 7, 3], [105, 8, 2], [85, 6, 2]],
    yellow: [[240, 165, 215, 150, 295], [250, 175, 225, 160, 315], [260, 185, 235, 170, 330]],
    red: [205, 145, 260], deload: { m: [190, 130, 240], ps: 180, pb: 120 }, bridge: { sq: 265, bn: 185, dl: 350 },
  },
};

// ── generated mains, waves 5+ ───────────────────────────────────────
const PCT = {
  singles: { // cycles 1–3
    sq: [0.848, 0.878, 0.908], bn: [0.849, 0.871, 0.893], dl: [0.843, 0.879, 0.905],
  },
  singlesC4: { sq: [0.84, 0.87, 0.899], bn: [0.849, 0.871, 0.893], dl: [0.849, 0.874, 0.906] },
  singlesC5: { sq: [0.87, 0.895, 0.915], bn: [0.87, 0.895, 0.915], dl: [0.87, 0.895, 0.915] },
  back: { sq: [0.725, 0.76, 0.80], bn: [0.72, 0.762, 0.806], dl: [0.71, 0.748, 0.795] },
  backC5: {
    sq: [[0.775, 4, 4], [0.805, 3, 5], [0.84, 2, 4]],
    bn: [[0.775, 4, 5], [0.805, 3, 5], [0.84, 2, 5]],
    dl: [[0.765, 4, 3], [0.795, 3, 4], [0.83, 2, 3]],
  },
  scheme: { sq: [[5, 4], [4, 5], [3, 5]], bn: [[5, 5], [4, 5], [3, 6]], dl: [[5, 3], [4, 4], [3, 4]] },
  ps: [0.635, 0.665, 0.71], pb: [0.655, 0.695, 0.74],
  bridge: { sq: 0.76, bn: 0.79, dl: 0.81 },
};
// ── incline bench: a tracked secondary press ramping to a 225 goal ──────
// Starts at 180 (≈0.80× his 225 bench CB, the usual flat:incline ratio) and
// gains in lockstep with the bench gate — one gate decision, two lifts. Reaches
// 225 when the bench CB reaches 270, i.e. wave 10 on a clean chain.
// Did the lifter clear a standard for this exercise during a given wave?
// null = no data (caller falls back to the schedule) · true = advance · false = hold.
function clearedInWave(pkey, wave, minW, minReps, minSets) {
  const ctx = HISTCTX;
  if (!ctx || !ctx.index) return null;
  const hist = ctx.index[pkey];
  if (!hist || !hist.length) return null;
  const from = waveStartUTC(wave, ctx.offsetWeeks || 0), to = from + 28 * MS_DAY;
  const inWave = hist.filter((e) => e.t >= from && e.t < to);
  if (!inWave.length) return null;
  return inWave.filter((e) => e.w >= minW - 0.01 && e.r >= minReps).length >= minSets;
}

const INCLINE_START = 180, INCLINE_GOAL = 225;
// [topPct, topReps, rpe, backPct, backReps, backSets]
const INCLINE_WK = [
  [0.78, 5, "7", 0.70, 8, 3],
  [0.82, 4, "7.5", 0.73, 7, 3],
  [0.86, 3, "8", 0.76, 6, 3],
  [null, 0, "5" + "\u2013" + "6", 0.62, 6, 3],
];
// Log-adaptive: each past wave advances +5 only if that wave's week-3 top set was
// actually cleared. Unlogged waves fall back to tracking the bench gate, so casual
// use still progresses. Logged-and-missed holds — same contract as the accessories.
function inclineCB(wave, gates) {
  let cb = INCLINE_START;
  for (let w = 1; w < wave; w++) {
    const target = R5(cb * INCLINE_WK[2][0]);
    const cleared = clearedInWave("incbb-top", w, target, INCLINE_WK[2][1], 1);
    if (cleared === null) cb += cbFor(w + 1, gates).bn - cbFor(w, gates).bn;
    else if (cleared) cb += 5;
  }
  return cb;
}
function inclineFor(wave, week, gates) {
  const cb = inclineCB(wave, gates), [tp, tr, rpe, bp, br, bs] = INCLINE_WK[week - 1];
  const out = [];
  if (tp) out.push({ type: "single", lift: "inc", name: "Incline Bench \u2014 top set", w: R5(cb * tp), reps: tr, sets: 1, rpe, moveId: "incbb", pkey: "incbb-top",
    note: "Ramping to " + INCLINE_GOAL + ". Barbell, 30\u201345\u00b0, touch the upper chest." });
  out.push({ type: "backoff", lift: "inc", name: "Incline Bench \u2014 " + (tp ? "back-offs" : "light"), w: R5(cb * bp), reps: br, sets: bs,
    rpe: tp ? "7" + "\u2013" + "8" : "5" + "\u2013" + "6", moveId: "incbb", pkey: "incbb-back", light: !tp });
  return out;
}

const RPE_CAP = { 1: 7, 2: 7.5, 3: 8 };
const RPE_CAP_C5 = { 1: 7.5, 2: 8, 3: "8–8.5" };

function mainsFor(wave, gates) {
  const cb = cbFor(wave, gates);
  const cyc = cycleOf(wave);
  if (wave <= 4 && !hasNonCleanGate(gates, wave)) return { cb, cyc, notes: NOTES[wave] };
  // generated (also used when gates alter CBs for waves ≤4 re-runs)
  const sPct = cyc === 5 ? PCT.singlesC5 : cyc === 4 ? PCT.singlesC4 : PCT.singles;
  const out = { cb, cyc, notes: null, gen: {} };
  for (const L of LIFTS) {
    const singles = sPct[L].map((p) => R5(cb[L] * p));
    let backs;
    if (cyc === 5) backs = PCT.backC5[L].map(([p, r, s]) => [R5(cb[L] * p), r, s]);
    else backs = PCT.back[L].map((p, i) => [R5(cb[L] * p), PCT.scheme[L][i][0], PCT.scheme[L][i][1]]);
    out.gen[L] = { s: singles, b: backs, l: R5(cb[L] * 0.65) };
  }
  out.gen.ps = [...PCT.ps.map((p) => R5(cb.sq * p)), R5(cb.sq * 0.565)];
  out.gen.pb = [...PCT.pb.map((p) => R5(cb.bn * p)), R5(cb.bn * 0.565)];
  out.gen.ohp = null; // computed in ohpFor
  out.gen.bridge = wave >= 3 ? { sq: R5(cb.sq * PCT.bridge.sq), bn: R5(cb.bn * PCT.bridge.bn), dl: R5(cb.dl * PCT.bridge.dl) } : null;
  out.gen.yellow = [0, 1, 2].map((i) => [
    R5(out.gen.sq.b[i][0] * 0.95), R5(out.gen.bn.b[i][0] * 0.95), R5(out.gen.ps[i] * 0.95),
    R5(out.gen.pb[i] * 0.95), R5(out.gen.dl.b[i][0] * 0.95),
  ]);
  out.gen.red = [R5(cb.sq * 0.6), R5(cb.bn * 0.6), R5(cb.dl * 0.6)];
  out.gen.deload = { m: [R5(cb.sq * 0.55), R5(cb.bn * 0.55), R5(cb.dl * 0.55)], ps: R5(cb.sq * 0.52), pb: R5(cb.bn * 0.51) };
  return out;
}
function hasNonCleanGate(gates, upTo) {
  if (!gates) return false;
  for (let w = 2; w <= upTo; w++) {
    const g = gates[w];
    if (g && LIFTS.some((L) => g[L] && g[L] !== "clean")) return true;
  }
  return false;
}
// unified accessor: mains data for a wave regardless of source
function mainTables(wave, gates) {
  const m = mainsFor(wave, gates);
  if (m.notes) return { cb: m.cb, cyc: m.cyc, t: m.notes, explicit: true };
  return { cb: m.cb, cyc: m.cyc, t: m.gen, explicit: false };
}

function ohpFor(wave, gates) {
  // Double progression, log-adaptive: 3x6 -> add reps to 3x8 clean -> +5 lb -> back to 3x6.
  // Advances a rung when 2+ sets cleared the wave's top rep target at the rung weight;
  // unlogged waves follow the schedule, logged-and-missed holds.
  const st = accStateLogged({ w: 95, steps: [6, 7, 8], inc: 5, db: false, i0: 0, pkey: "ohp" }, wave, HISTCTX);
  const lo = st.steps ? st.steps[st.i] : [6, 7, 8][st.i], hi = [6, 7, 8][Math.min(st.i + 1, 2)];
  return [[st.w, lo, 3], [st.w, hi, 3], [st.w, hi, 2], [R5(st.w * 0.78), 6, 2]];
}

// state of an accessory at a given wave (1-indexed): {w, i} where reps = (steps[i], steps[i+1])
function accState(a, wave) {
  let w = a.w, i = a.i0 || 0;
  const last = a.steps.length - 1;
  for (let k = 1; k < wave; k++) {
    if (i + 1 >= last) { // hit the top this wave → bump next wave
      if (a.inc > 0) w = a.db ? R25(w + a.inc) : w + a.inc;
      i = 0;
    } else i++;
  }
  return { w, i };
}
// ── log-driven progression ──────────────────────────────────────────
// Every logged set is stamped with a stable exercise key (`k`). At each wave
// boundary the rung advances ONLY if some session that wave hit the top of the
// rep range on 2+ sets at >= the rung weight. Logged heavier + cleared reps →
// the user's weight is adopted (loads are floors). Unlogged waves fall back to
// the schedule, so casual use degrades gracefully.
const pkeyOf = (name) => String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let HISTCTX = null; // set per sessionFor call: { index: {pkey: [{t,w,r}]}, offsetWeeks }

function accStateLogged(def, wave, ctx) {
  if (!ctx || !ctx.index) return accState(def, wave);
  const hist = ctx.index[def.pkey];
  if (!hist || !hist.length) { const st = accState(def, wave); return { ...st, prog: null }; }
  let w = def.w, i = def.i0 || 0;
  const last = def.steps.length - 1;
  for (let k = 1; k < wave; k++) {
    const atTop = i + 1 >= last;
    const topReq = def.steps[Math.min(i + 1, last)];
    const from = waveStartUTC(k, ctx.offsetWeeks || 0), to = from + 28 * MS_DAY;
    const inWave = hist.filter((e) => e.t >= from && e.t < to);
    // group into sessions by calendar day
    const byDay = new Map();
    for (const e of inWave) { const d = Math.floor(e.t / MS_DAY); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(e); }
    let qualified = null;
    for (const sess of byDay.values()) {
      if (sess.length < 2) continue; // one set is a fluke, not a rung clear
      // 2+ sets clearing the top is the documented rule. Requiring EVERY set to
      // clear made progression nearly impossible on 4-5 set exercises, and
      // directly contradicted the "final set to RPE 9-10" cue — which drops reps
      // on the last set by design. Logging honestly must never cost a rung.
      const clears = sess.filter((e) => e.r >= topReq && e.w >= w - 0.01);
      if (clears.length >= 2) { qualified = clears; break; }
    }
    if (qualified) {
      const minW = Math.min(...qualified.map((e) => e.w));
      const base = Math.max(w, def.db ? R25(minW) : R5(minW)); // adopt heavier logged weight
      if (atTop) { w = def.inc > 0 ? (def.db ? R25(base + def.inc) : base + def.inc) : base; i = 0; }
      else { w = base; i = i + 1; }
    } else if (!byDay.size) {
      // nothing logged this wave → scheduled fallback
      if (atTop) { if (def.inc > 0) w = def.db ? R25(w + def.inc) : w + def.inc; i = 0; }
      else i++;
    }
    // logged but failed → hold the rung
  }
  const sched = accState(def, wave);
  const prog = (w === sched.w && i === sched.i) ? "on"
    : (w < sched.w || (w === sched.w && i < sched.i)) ? "held" : "ahead";
  return { w, i, prog };
}

// prescription for accessory a at wave/week (week 1–4), with cycle trims
function accFor(a, wave, week) {
  const st = accStateLogged({ w: a.w, steps: a.steps, inc: a.inc, db: a.db, i0: a.i0, pkey: a.id }, wave, HISTCTX);
  const { w, i } = st;
  const cyc = cycleOf(wave);
  const last = a.steps.length - 1;
  const repLow = a.steps[i], repHigh = a.steps[Math.min(i + 1, last)];
  let sets = week === 3 ? a.w3 : a.sets;
  if (cyc === 5 && a.comp) sets = Math.max(1, sets - 1);
  if (cyc === 6) {
    if (week === 1) sets = Math.max(1, Math.round(sets * 0.7));
    else if (week === 2) sets = Math.max(1, Math.round(sets * 0.5));
    else return null; // wk 3–4 of a peak: no accessory work
  }
  if (week === 4) {
    const lw = a.w === 0 ? 0 : a.db ? R25(w * 0.7) : R5(w * 0.7);
    return { w: lw, reps: repLow, sets: 2, rpe: "6–7", light: true };
  }
  const reps = week === 2 ? repHigh : repLow;
  const topSet = repHigh === a.steps[last] && week === 2;
  // Proximity to failure is the highest-leverage variable left in this program.
  // v7: "safe machine/cable isolations — final set may reach RPE 9-10 in Wks 1-2."
  // Compounds stay capped at 8; week 3 trims; deload and peak never push.
  const lastHard = !a.comp && week <= 2 && cyc <= 4;
  return { w, reps, sets, rpe: week === 3 ? "8" : "8–9", top: topSet, prog: st.prog, lastHard };
}

function sx(name, seed, steps, sets, rpe, arch, moveId, db, cap, inc, wv) {

    sets, rpe, arch, moveId, db: !!db, cap: cap || "", spec: true, repN: lo,
    top: hi === steps[last] && steps.length > 1, pkey: pkeyOf(name), prog: st.prog,
  };
}

// is Sunday actually planned/running this wave-week? (Wks 1–2 of Cycles 1–4, and enabled)
function sundayPlanned(wave, week, spec) {
  return !!(spec && spec.sundayOn) && cycleOf(wave) <= 4 && week <= 2;
}
// do the weekday volume transfers fire this week? (only when Sunday runs)
function transfersActive(wave, week, spec) { return sundayPlanned(wave, week, spec); }

// Saturday: paused bench is on Thursday, so Saturday = pure frame-isolation overload
function saturdaySession(wave, week, spec) {
  spec = spec || DEFAULT_SPEC;
  const cyc = cycleOf(wave);
  const blocks = [];
  if (cyc === 6) { // peak: no specialization
    blocks.push({ type: "test", name: "Peak week — no specialization", note: "Brief maintenance only if anything. Frame work resumes next macro — the peak exposes strength, it doesn't build the physique." });
    return blocks;
  }
  if (week === 4) { // light week / deload: maintenance only
    blocks.push(sx("Machine / Cable Lateral Raise", 12.5, [12, 15], 2, "6–7", "lateral", "latwed", false, "Light maintenance — deliberately flat", 0, 1));
    blocks.push(sx("Reverse-Pec-Deck", 50, [15], 2, "6–7", "rearfly", "revpec", false, "Light maintenance", 0, 1));
    blocks.push(sx("Cable Triceps", 40, [12, 15], 2, "6–7", "pushdown", "pushdown", false, "Light maintenance", 0, 1));
    blocks.push(sx("Ab Wheel / Cable Crunch", 100, [10, 15], 2, "6–7", "crunch", "crunch", false, "", 0, 1));
    return blocks;
  }
  const reduced = week === 3 || cyc === 5; // Wk3 and Cycle 5: fewer sets
  const frame = FRAME_MODULE[spec.framePrimary](wave);
  frame.forEach((ex) => blocks.push({ ...ex, sets: reduced ? 2 : ex.sets, primary: true }));
  const triSpec = spec.detail === "triceps";
  if (!reduced) {
    // the "omit secondary on triceps weeks" rule assumes a TORSO primary; when arms IS
    // the primary, dropping it would leave the day with zero back work.
    if (!triSpec || spec.framePrimary === "arms") {
      const sec = SECONDARY_SLOT[spec.frameSecondary || "none"](wave);
      if (sec) blocks.push(sec);
    }
  }
  if (triSpec) {
    // when arms IS the priority the module already has overhead work — don't double it
    if (spec.framePrimary !== "arms") blocks.push(sx("Overhead Cable Extension", 50, [10, 12, 15], reduced ? 2 : 3, "8–9", "ohtri", "ohrope", false, "Long-head bias — arms overhead", 5, wave));
    if (!reduced) blocks.push(sx("Rope / Single-Arm Pushdown", 70, [12, 15, 20], 2, "8–9", "pushdown", "pushdown", false, "", 5, wave));
  } else {
    if (spec.framePrimary === "arms") blocks.push(sx("Rope Pushdown", 50, [12, 15, 20], reduced ? 2 : 3, "8–9", "pushdown", "pushdown", false, "Lateral + medial head \u2014 overhead work is already in the module", 5, wave));
    else blocks.push(sx("Overhead Cable Extension", 50, [10, 12, 15], reduced ? 2 : 3, "8–9", "ohtri", "ohrope", false, "Triceps slot", 5, wave));
  }
  if (!reduced) blocks.push(balanceSlot(spec.framePrimary, wave));
  blocks.push(sx("Ab Wheel / Cable Crunch", 70, [8, 10, 12, 15], 2, "8–9", "crunch", "crunch", false, "", 10, wave));
  return blocks;
}

// Sunday: optional detail — only Wks 1–2 of Cycles 1–4 and enabled
function sundaySession(wave, week, spec) {
  spec = spec || DEFAULT_SPEC;
  if (!sundayPlanned(wave, week, spec)) return null;
  const tmpl = spec.framePrimary === "arms" ? DETAIL_TEMPLATE.armsPrimary(wave)
    : isDefaultSpec(spec) ? DETAIL_TEMPLATE.recommended(wave)
    : (DETAIL_TEMPLATE[spec.detail] || DETAIL_TEMPLATE.recommended)(wave);
  return tmpl;
}
function isDefaultSpec(spec) {
  return spec && spec.framePrimary === "shoulders" && spec.frameSecondary === "latwidth" && spec.detail === "triceps";
}

// ── warm-ups ────────────────────────────────────────────────────────
function warmups(lift, wave, gates) {
  const { t } = mainTables(wave, gates);
  const br = t.bridge ? t.bridge[lift] : null;
  const base = {
    sq: [["Bar", 10], [95, 5], [135, 5], [185, 3], [225, "1 · indicator — film"]],
    bn: [["Bar", 15], [95, 8], [135, 5], [155, 3], [165, "1 · indicator — film"]],
    dl: [[135, 5], [225, 3], [275, 2], [315, "1 · indicator — film"]],
  }[lift].slice();
  if (br) base.push([br, "1 · bridge"]);
  return base;
}
const WARM_PS = [["Bar", 10], [95, 5], [135, 5], [175, 3]];
const WARM_PB = [["Bar", 15], [95, 8], [115, 5], [135, 3]];

// ── session builder ─────────────────────────────────────────────────
// returns ordered blocks for wave/week/day (1=Mon…5=Fri)
function sessionFor(wave, week, day, gates, spec, histCtx) {
  HISTCTX = histCtx || null;
  try { return sessionForInner(wave, week, day, gates, spec); }
  finally { HISTCTX = null; }
}
function sessionForInner(wave, week, day, gates, spec) {
  spec = spec || DEFAULT_SPEC;

  // ── Saturday (day 6): frame-specialization overload ──
  if (day === 6) {
    const label = FRAME_LABEL[spec.framePrimary] || "Frame";
    const head = { type: "spechead", name: "Frame Specialization — " + label + " priority", note: cycEarly === 6 ? "Peak macro — spec paused." : week === 4 ? "Light week — maintenance only." : (week === 3 || cycEarly === 5) ? "Reduced sets this week." : "Overload day. Hit your weak point fresh — quality reps, not a set count.", moveId: null };
    return [head, ...saturdaySession(wave, week, spec)];
  }
  // ── Sunday (day 7): optional detail ──
  if (day === 7) {
    const s = sundaySession(wave, week, spec);
    if (!s) return [{ type: "spechead", name: "Optional detail day — off", note: cycEarly > 4 ? "No weekend specialization in this cycle. Rest or an easy walk + conditioning." : week > 2 ? "Sunday detail runs only Weeks 1–2 of a cycle. Rest today." : (spec && spec.sundayOn) ? "Rest today." : "Sunday is toggled off in Specialize. Rest or an easy walk.", moveId: null }];
    const label = DETAIL_LABEL[spec.detail] || "Detail";
    const head = { type: "spechead", name: "Optional Detail — " + (spec.framePrimary === "arms" ? "Biceps-led (Sat carried the triceps)" : isDefaultSpec(spec) ? "Arms & silhouette" : label), note: "Green only: 7h+ sleep, normal Fri deadlift + Sat, no elbow/shoulder pain, no flat session. Anchor first, then supersets — 35–45 min, 60–90s rest. Printed loads are FLOORS: if a set is easy, jump the weight and log what you did.", moveId: null };
    return [head, ...s];
  }
  const { cb, cyc, t } = mainTables(wave, gates);
  const blocks = [];
  const wk = week - 1; // 0-index for arrays of 3
  const dayLift = { 1: "sq", 2: "bn", 5: "dl" }[day];
  const push = (b) => blocks.push(b);
  const xfer = transfersActive(wave, week, spec); // volume transfers fund Sunday

  if (cyc === 6) return peakSession(wave, week, day, cb, gates);

  if (dayLift) {
    push({ type: "warmup", name: LIFT_NAME[dayLift] + " warm-up", rows: warmups(dayLift, wave, gates) });
    if (day === 2 && cyc !== 6) {   // primer: 60 seconds, before the bar touches your chest
      const pa = ACC.find((x) => x.id === "pullapart"), p = accFor(pa, wave, week);
      if (p) push({ type: "accessory", name: pa.name, w: p.w, reps: p.reps, sets: p.sets, rpe: "7", db: false, moveId: pa.id, cap: pa.cap, pkey: pa.id, prog: p.prog });
    }
    if (week < 4) {
      const cap = cyc === 5 ? RPE_CAP_C5[week] : RPE_CAP[week];
      push({ type: "single", lift: dayLift, name: LIFT_NAME[dayLift] + " — top single", w: t[dayLift].s[wk], reps: 1, sets: 1, rpe: cap, moveId: dayLift, pkey: dayLift + "-single" });
      const [bw, br_, bs] = t[dayLift].b[wk];
      push({ type: "backoff", lift: dayLift, name: LIFT_NAME[dayLift] + " — back-offs", w: bw, reps: br_, sets: bs, rpe: week === 3 ? "7.5–8" : week === 2 ? "7–7.5" : "6.5–7", moveId: dayLift, pkey: dayLift + "-back" });
    } else {
      push({ type: "backoff", lift: dayLift, name: LIFT_NAME[dayLift] + " — light triple", w: t[dayLift].l, reps: 3, sets: 3, rpe: "5–6", light: true, moveId: dayLift, pkey: dayLift + "-light" });
    }
  }
  if (day === 3) {
    push({ type: "warmup", name: "Paused squat warm-up", rows: WARM_PS });
    const scheme = week === 4 ? [5, 2] : [[5, 4], [4, 4], [3, 4]][wk];
    push({ type: "paused", lift: "sq", name: "Paused Squat (2-sec pause)", w: t.ps[wk] ?? t.ps[3], reps: scheme[0], sets: scheme[1], rpe: week === 4 ? "5–6" : ["6", "6.5", "7"][wk], moveId: "ps", pkey: "ps" });
  }
  if (day === 4) {
    push({ type: "warmup", name: "Paused bench warm-up", rows: WARM_PB });
    const scheme = week === 4 ? [5, 3] : [[6, 4], [5, 5], [4, 5]][wk];
    push({ type: "paused", lift: "bn", name: "Paused Bench (1–2 sec pause)", w: t.pb[wk] ?? t.pb[3], reps: scheme[0], sets: scheme[1], rpe: week === 4 ? "5–6" : ["6.5–7", "7", "7–7.5"][wk], moveId: "pb", pkey: "pb" });
    const o = ohpFor(wave, gates)[week - 1];
    push({ type: "ohp", name: "Overhead Press", w: o[0], reps: o[1], sets: o[2], rpe: week === 4 ? "5–6" : "7–8", note: "Add reps to 3×8 clean → +5 lb → back to 3×6", moveId: "ohp", pkey: "ohp" });
  }
  // Thursday sheds its delt/triceps isolation → migrated into Saturday's specialization
  const THU_DROP = new Set(["latthu", "rdf"]); // delt work migrates to Sat; triceps STAYS on Thu
  if (day === 2 && cyc !== 6) for (const b of inclineFor(wave, week, gates)) push(b);
  for (const a of ACC.filter((x) => x.day === day)) {
    if (day === 4 && THU_DROP.has(a.id)) continue;
    if (a.id === "pullapart") continue;   // already pushed as the pre-press primer
    if (a.id === "incline" && spec.secondaryPress === "closegrip") {
      const cg = mainTables(wave, gates).cb.bn;
      push({ type: "accessory", name: "Close-Grip Bench", w: R5(cg * 0.62), reps: week === 2 ? 8 : 6, sets: week === 3 ? 2 : 3,
        rpe: "7\u20138", db: false, moveId: "bn", spec: false, repN: 6,
        cap: "RPE 8 HARD CAP \u2014 lockout + triceps strength. Never a second bench day." });
      continue;
    }
    if (xfer && a.id === "lattue") continue;             // transfer: Tue laterals → Sunday
    if (xfer && (a.id === "ezcurl" || a.id === "hammer")) continue; // transfer: Wed EZ + hammer → Sunday (incline curl kept)
    if (xfer && a.id === "crossbody") continue;         // transfer: Thu cross-body → Sunday
    const p = accFor(a, wave, week);
    if (!p) continue;
    // frame bias: lat-width / upper-back priority trims the Friday row to 2 sets
    let sets = p.sets;
    if (day === 5 && a.id === "rowfri" && (spec.framePrimary === "latwidth" || spec.framePrimary === "upperback") && week < 4) sets = Math.min(sets, 2);
    push({ type: "accessory", name: a.name, w: p.w, reps: p.reps, sets, rpe: p.rpe, db: a.db, top: p.top, moveId: a.id, cap: a.cap, pkey: a.id, prog: p.prog, lastHard: p.lastHard });

  if (day === 4 && week < 4 && !sundayPlanned(wave, week, spec) && cyc <= 4) {
    push(sx("Cable Preacher Curl", 40, [8, 10, 12], 3, "8" + "\u2013" + "9", "curl", "inccurl", false,
      "Backfill \u2014 covers the biceps volume Sunday would have supplied", 5, wave));

  if (day === 4 && week < 4 && xfer) push({ type: "note", name: "Delt & triceps isolation → Saturday", note: "Your side-delt, rear-delt and pushdown work lives in Saturday's frame day now — keeps weekly volume under cap." });
  if (day === 3 && cyc !== 6) {
    const walk = week === 4 ? "15 min · 2.8 mph · 4%" : ["20 min · 3 mph · 6%", "20 min · 3 mph · 7%", "15 min · 3 mph · 5%"][wk];
    push({ type: "conditioning", name: "Incline Walk", note: walk });
  }

  // Distinct type: Yellow mode drops conditioning but KEEPS the cooldown.
  const COOL = { 1: "POSTURE: couch stretch 2×30s/side (hip flexors = the anterior tilt fix) · ankle rocks 15/side · dead hang 30s", 2: "POSTURE: doorway pec stretch 2×30s (tight pecs pull you forward) · cross-body delt 30s/side · wall slides ×10", 3: "90/90 hips 60s/side · standing hamstring 45s/side", 4: "POSTURE: thoracic extension over bench 45s · lat hang 45s · chin tucks ×10 (the tech-neck fix)", 5: "Hamstring 60s/side · figure-4 glute 45s/side · shake the grip out" };
  if (COOL[day]) push({ type: "cooldown", name: "Cooldown — 5 min", note: COOL[day] + " · easy breathing, no bouncing" });
  return blocks;
}

// Cycle 6 (waves 6, 12, 18): the peak
function peakSession(wave, week, day, cb, gates) {
  const blocks = [];
  const dayLift = { 1: "sq", 2: "bn", 5: "dl" }[day];
  const push = (b) => blocks.push(b);
  if (week === 4) {
    if (day === 1) push({ type: "test", name: "TAPER — brief crisp technique, then rest", note: "Cut volume ≥50%. Last DL exposure ~7 days out, squat ~5–7, bench touch ~3–5. Full rest final 2 days. Test is Friday." });
    if (day === 2) push({ type: "test", name: "TAPER — optional light bench touch", note: "A few crisp triples ~60%, only if it reliably helps you. Otherwise rest. Test is Friday." });
    if (day === 3 || day === 4) push({ type: "test", name: "TAPER — full rest", note: "Walk, eat, sleep. Nothing heavier than a warm-up. Test is Friday." });
    if (day === 5) {
      const att = testAttempts(cb);
      push({ type: "test", name: "TEST DAY — 1st/2nd/3rd attempts", note: "Squat → Bench → Deadlift. Safeties + spotters. No misses.", attempts: att });
    }
    return blocks;
  }
  if (dayLift) {
    push({ type: "warmup", name: LIFT_NAME[dayLift] + " warm-up", rows: warmups(dayLift, wave, gates) });
    const sp = [0.89, 0.91, 0.905][week - 1];
    const cap = ["8", "8–8.5", "8–8.5 · opener practice"][week - 1];
    push({ type: "single", lift: dayLift, name: LIFT_NAME[dayLift] + " — " + (week === 3 ? "opener" : "top single"), w: R5(cb[dayLift] * sp), reps: 1, sets: 1, rpe: cap, moveId: dayLift, pkey: dayLift + "-single" });
    const back = week === 1 ? [R5(cb[dayLift] * 0.77), 3, 3, "7"] : week === 2 ? [R5(cb[dayLift] * 0.79), 2, 3, "7–7.5"] : [R5(cb[dayLift] * 0.70), 2, 2, "easy"];
    push({ type: "backoff", lift: dayLift, name: LIFT_NAME[dayLift] + " — back-offs", w: back[0], reps: back[1], sets: back[2], rpe: back[3], moveId: dayLift, pkey: dayLift + "-back" });
  }
  if (day === 3 && week <= 2) {
    push({ type: "paused", lift: "sq", name: "Paused Squat (easy)", w: R5(cb.sq * (week === 1 ? 0.66 : 0.60)), reps: 5, sets: week === 1 ? 3 : 2, rpe: "6", moveId: "ps", pkey: "ps" });
  }
  if (day === 4 && week <= 2) {
    push({ type: "paused", lift: "bn", name: "Paused Bench (easy)", w: R5(cb.bn * (week === 1 ? 0.68 : 0.60)), reps: 5, sets: week === 1 ? 3 : 2, rpe: "6", moveId: "pb", pkey: "pb" });
  }
  if (week === 3) {
    if (day === 3 || day === 4) push({ type: "test", name: "Opener week — 1–2 easy accessories only", note: "No OHP, no arm work, no conditioning fatigue this week." });
  } else {
    for (const a of ACC.filter((x) => x.day === day)) {
      const p = accFor(a, wave, week);
      if (!p) continue;
      push({ type: "accessory", name: a.name, w: p.w, reps: p.reps, sets: p.sets, rpe: "7 (easy)", db: a.db, moveId: a.id, cap: a.cap, pkey: a.id, prog: p.prog });
    }
  }
  return blocks;
}

function testAttempts(cb, entered = {}) {
  const out = {};
  for (const L of LIFTS) {
    const tm = entered[L] || R5(cb[L] * 1.04);
    out[L] = {
      max: tm,
      a1: R5(tm * 0.91),
      a2: tm,
      a3note: L === "bn" ? "+2.5–5 only if 2nd was clean and ≤RPE 9" : "+5–10 only if 2nd was clean and ≤RPE 9",
    };
  }
  return out;
}

// yellow transform: applied by UI — single cap RPE 7, back-off −5% (or −1 set), 2 sets/accessory, skip cardio
function yellowW(block) {
  if (block.type === "single") return { ...block, rpe: 7, note: "Yellow: cap @ RPE 7" };
  if (block.type === "backoff" || block.type === "paused") return { ...block, w: R5(block.w * 0.95), note: "Yellow: −5% (or keep weight, −1 set)" };
  if (block.type === "accessory" || block.type === "ohp") return { ...block, sets: Math.min(block.sets, 2), rpe: "≤8", note: "Yellow: 2 sets cap" };
  if (block.type === "conditioning") return null;
  return block;
}
function redSession(wave, day, gates) {

/* ── TRENDS ── */
function svgChart(pts, opts = {}) {
  const W = 520, H = 170, P = 34;
  if (!pts.length) return `<p class="note">${opts.empty || "Nothing logged yet — this chart grows as you train."}</p>`;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y).concat(opts.extraY || []);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max((y1 - y0) * 0.15, 2); y0 -= pad; y1 += pad;
  const X = (v) => P + ((v - x0) / (x1 - x0)) * (W - P - 10);
  const Y = (v) => H - 22 - ((v - y0) / (y1 - y0)) * (H - 34);
  let g = "";
  for (let i = 0; i <= 3; i++) { const yy = 12 + (i * (H - 34)) / 3; g += `<line x1="${P}" y1="${yy}" x2="${W - 10}" y2="${yy}" stroke="#232830"/>`; }
  let band = "";
  if (opts.band) {
    const b = opts.band.filter((p) => p.x >= x0 && p.x <= x1);
    if (b.length > 1) band = `<path d="M${b.map((p) => `${X(p.x)},${Y(p.lo)}`).join(" L")} L${[...b].reverse().map((p) => `${X(p.x)},${Y(p.hi)}`).join(" L")} Z" fill="rgba(255,178,36,.10)"/>`;
  }
  const line = (arr, color, dash) => arr.length > 1 ? `<path d="M${arr.map((p) => `${X(p.x)},${Y(p.y)}`).join(" L")}" fill="none" stroke="${color}" stroke-width="2.4" ${dash ? 'stroke-dasharray="5 4"' : ""}/>` : "";
  const dots = (arr, color) => arr.map((p) => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6" fill="${color}"/>`).join("");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${band}
    ${opts.line2 ? line(opts.line2, "#8b919c", true) : ""}
    ${line(pts, "#e9e7e1")}${dots(pts, "#e9e7e1")}
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4.5" fill="#ffb224"/>
    <text x="${P - 5}" y="${Y(y1 - pad) + 4}" fill="#8b919c" font-size="11" text-anchor="end">${Math.round(y1 - pad)}</text>
    <text x="${P - 5}" y="${Y(y0 + pad) + 4}" fill="#8b919c" font-size="11" text-anchor="end">${Math.round(y0 + pad)}</text>
    <text x="${X(last.x)}" y="${Y(last.y) - 9}" fill="#ffb224" font-size="12" font-weight="700" text-anchor="middle">${last.y}</text>
    <text x="${P}" y="${H - 6}" fill="#5d6470" font-size="10.5">${fmtShort(x0)}</text>
    <text x="${W - 10}" y="${H - 6}" fill="#5d6470" font-size="10.5" text-anchor="end">${fmtShort(x1)}</text></svg>`;
}
let trendLift = "sq";
function renderTrends() {
  const bwPts = Object.entries(S.bw).filter(([k]) => DK_RE.test(k)).sort().map(([k, v]) => ({ x: Date.parse(k), y: v }));
  const band = [];
  // lo = net pace incl. annual trim blocks · hi = gain-phase pace (+0.25/wk)
  for (let wk = 0; wk <= 210; wk += 2) band.push({ x: E.WAVE1_MONDAY + wk * 7 * E.MS_DAY, lo: Math.round((182 + 0.085 * wk) * 10) / 10, hi: Math.round((182 + 0.25 * wk) * 10) / 10 });
  const tops = [], e1s = [];
  for (const [dk, log] of Object.entries(S.logs).filter(([k]) => DK_RE.test(k)).sort()) {
    if (!log.sets) continue;
    const loc = E.whereIs(Date.parse(dk), S.settings.offsetWeeks || 0);
    if ({ 1: "sq", 2: "bn", 5: "dl" }[loc.day] !== trendLift) continue;
    let best = 0, bestE = 0;
    for (const arr of Object.values(log.sets)) for (const st of arr) {
      if (st.w > best && st.r >= 1) best = st.w;
      const e = st.w * (1 + st.r / 30); if (e > bestE) bestE = e;
    }
    if (best) tops.push({ x: Date.parse(dk), y: best });
    if (bestE) e1s.push({ x: Date.parse(dk), y: Math.round(bestE) });
  }
  const prs = E.LIFTS.map((L) => {
    let best = null;
    for (const [dk, log] of Object.entries(S.logs).filter(([k]) => DK_RE.test(k))) {
      if (!log.sets) continue;
      const loc = E.whereIs(Date.parse(dk), S.settings.offsetWeeks || 0);
      if ({ 1: "sq", 2: "bn", 5: "dl" }[loc.day] !== L) continue;
      for (const arr of Object.values(log.sets)) for (const st of arr)
        if (st.r >= 1 && (!best || st.w > best.w)) best = { w: st.w, dk };
    }
    return { L, best };
  });
  const wkAvg = weeklyAverages(8);
  // ── waist & frame: the auditor. Bodyweight up + waist flat = building, not bloating.
  const mk = Object.keys(S.meas).filter((k) => DK_RE.test(k)).sort();
  const last = mk.length ? S.meas[mk[mk.length - 1]] : null;
  const first = mk.length ? S.meas[mk[0]] : null;
  const ratio = last && last.sh && last.wa ? (last.sh / last.wa) : null;
  const dW = last && first && mk.length > 1 ? +(last.wa - first.wa).toFixed(1) : null;
  const bwKeys = Object.keys(S.bw).filter((k) => DK_RE.test(k)).sort();
  const dBW = bwKeys.length > 1 ? +(S.bw[bwKeys[bwKeys.length - 1]] - S.bw[bwKeys[0]]).toFixed(1) : null;
  const verdict = (dBW == null || dW == null) ? "Log two months to get a verdict."
    : dBW > 0 && dW <= 0.25 ? "✅ Bodyweight up, waist flat — this is exactly right."
    : dBW > 0 && dW > 0.25 ? "⚠️ Waist rising with the scale — surplus is too big. Drop 150 cal."
    : dBW <= 0 && dW < 0 ? "Leaning out. Fine if that's the phase you're in."
    : "Scale flat — you're at maintenance, not gaining.";
  const measCard = `<div class="card single"><div class="eyebrow sig">Waist &amp; frame — the auditor</div>
    <p class="note">Abs are a body-fat number, not a training one. Waist is the metric that tells you whether the scale climbing is muscle or padding.</p>
    <div class="metrics" style="margin-top:8px">
      <label>Waist <input type="number" step="0.25" inputmode="decimal" id="mw" value="${last && last.wa ? last.wa : ""}"> in</label>
      <label>Shoulders <input type="number" step="0.25" inputmode="decimal" id="ms" value="${last && last.sh ? last.sh : ""}"> in</label>
      <button class="btn" onclick="logMeas()">Log</button>
    </div>
    ${ratio ? `<div class="statline" style="margin-top:8px"><span class="note">Shoulder ÷ waist</span> <b style="font-size:20px;font-variant-numeric:tabular-nums">${ratio.toFixed(2)}</b> <span class="note">· 1.4 athletic · 1.5 strong V · 1.6 elite</span></div>` : ""}
    <p class="note" style="margin-top:8px">${esc(verdict)}</p>
    ${mk.length ? `<div class="tablewrap" style="margin-top:8px"><table><tr><th>Date</th><th>Waist</th><th>Shoulders</th><th>Ratio</th></tr>${mk.slice(-6).reverse().map((k) => { const m = S.meas[k]; return `<tr><td>${esc(k)}</td><td>${m.wa || "—"}</td><td>${m.sh || "—"}</td><td>${m.sh && m.wa ? (m.sh / m.wa).toFixed(2) : "—"}</td></tr>`; }).join("")}</table></div>` : `<p class="note">Nothing logged. Measure cold, relaxed, first thing — waist at the navel, shoulders at the widest point. Monthly, same conditions.</p>`}
    <p class="note" style="margin-top:8px">Visible abs sit at 10–12% for most men. At your 15% goal expect a flat stomach, not a six-pack — run a 6–8 week trim when you want them for a date.</p></div>`;
  $("#view").innerHTML = measCard + `
    <div class="card"><div class="eyebrow sig">Bodyweight — road to 200</div>
      <div class="chartwrap">${svgChart(bwPts, { band, empty: "Log a morning weigh-in on the Today tab and the road to 200 draws itself." })}</div>
      <div class="legend"><span><span class="k" style="background:#e9e7e1"></span>morning weigh-ins</span><span><span class="k" style="background:rgba(255,178,36,.5)"></span>on-pace band (0.25–0.5 lb/wk)</span></div>
      ${wkAvg.length ? `<div class="tablewrap" style="margin-top:10px"><table><tr><th>Week of</th><th>Avg</th><th>Δ</th><th>Call</th></tr>${wkAvg.map((r) => `<tr><td>${r.wk}</td><td>${r.avg}</td><td>${r.d === null ? "—" : (r.d > 0 ? "+" : "") + r.d}</td><td class="note">${r.call}</td></tr>`).join("")}</table></div>` : ""}
      <p class="note" style="margin-top:8px">Gain mode: 3,050 cal · P 190 · +0.25 lb/wk. Trim only at ~18% BF (4–6 wks, stop at 15%). Goal: <b style="color:var(--chalk)">200 @ 15%</b> ≈ 170 lb lean.</p></div>
    <div class="card"><div class="eyebrow sig">Strength</div>
      <div class="seg">${E.LIFTS.map((L) => `<button class="y ${trendLift === L ? "on" : ""}" onclick="trendLift='${L}';render()">${E.LIFT_NAME[L]}</button>`).join("")}</div>
      <div class="chartwrap">${svgChart(tops, { line2: e1s, empty: "Log sets on a " + E.LIFT_NAME[trendLift] + " day to start this chart." })}</div>
      <div class="legend"><span><span class="k" style="background:#e9e7e1"></span>heaviest set that day</span><span><span class="k" style="background:#8b919c"></span>est. 1RM (Epley)</span></div></div>
    <div class="card"><div class="eyebrow">All-time bests (logged)</div>
      ${prs.map((p) => `<div class="lset"><span>${E.LIFT_NAME[p.L]}</span><span class="x" style="color:var(--chalk);font-weight:700">${p.best ? esc(String(p.best.w)) + " · " + esc(p.best.dk) : "—"}</span></div>`).join("")}
      <p class="note" style="margin-top:6px">North Star 315 / 405 / 495 · Dec checkpoint 235–245 / 315–335 / 405–425</p></div>`;
}
function weeklyAverages(n) {
  const out = []; const t = todayUTC();
  for (let i = 0; i < n; i++) {
    const end = t - i * 7 * E.MS_DAY, start = end - 6 * E.MS_DAY;
    const vals = [];
    for (let d = start; d <= end; d += E.MS_DAY) { const v = S.bw[keyOf(d)]; if (Number.isFinite(v)) vals.push(v); }
    if (!vals.length) continue;
    const avg = Math.round((vals.reduce((a, b) => a + b) / vals.length) * 10) / 10;
    out.unshift({ wk: fmtShort(start), avg, d: null, call: "" });
  }
  for (let i = 1; i < out.length; i++) out[i].d = Math.round((out[i].avg - out[i - 1].avg) * 10) / 10;
  for (let i = 0; i < out.length; i++) {
    const d = out[i].d;
    out[i].call = d === null ? "" : d <= 0 ? "flat — 2 wks flat → +150 cal" : d > 0.75 ? "hot → −100–150 cal" : "on pace";
  }
  return out.slice(-4);
}

/* ── MORE ── */
function renderMore() {
  const logged = Object.keys(S.logs).filter((k) => DK_RE.test(k) && S.logs[k].sets && Object.keys(S.logs[k].sets).length).sort().reverse();
  $("#view").innerHTML = `
    <div class="card"><div class="eyebrow sig">History</div>
      ${logged.length ? logged.slice(0, 40).map((dk) => { const loc = E.whereIs(Date.parse(dk), S.settings.offsetWeeks || 0); return `<div class="lset"><span>${esc(dk)} · W${loc.wave}·wk${loc.week}·d${loc.day}${S.logs[dk].r ? " · " + esc(S.logs[dk].r) : ""}</span><button class="x" onclick="delDay('${esc(dk)}')">✕</button></div>`; }).join("") : `<p class="note">No sessions logged yet. They'll pile up here.</p>`}</div>
    <div class="card"><div class="eyebrow sig">Weekend specialization</div>
      <p class="note">Sat = frame overload · Sun = optional detail. Focus: <b style="color:var(--chalk)">${esc(E.FRAME_LABEL[S.spec.framePrimary])}</b> + <b style="color:var(--chalk)">${esc(E.DETAIL_LABEL[S.spec.detail])}</b>.</p>
      <div class="rowbtns"><button class="btn" onclick="specSheet()">⚙ Configure</button><button class="btn ghost" onclick="ledgerSheet()">📒 Ledger</button></div></div>
    <div class="card"><div class="eyebrow sig">Data</div>
      <p class="note">Logs live in THIS browser only. Export after every test day and keep the file safe.</p>
      <div class="rowbtns"><button class="btn" onclick="exportData()">Export backup</button>
      <button class="btn ghost" onclick="importSheet()">Import</button></div></div>
    <div class="card"><div class="eyebrow sig">Settings</div>
      <label class="note">Schedule shift (weeks) — for mini-cuts or life: <input type="number" value="${S.settings.offsetWeeks || 0}" onchange="S.settings.offsetWeeks=+this.value||0;save();render()"></label>
      <div class="rowbtns"><button class="btn danger" onclick="if(confirm('Erase ALL logs, gates and settings?')){localStorage.removeItem(KEY);location.reload()}">Erase everything</button></div></div>
    <div class="card"><div class="eyebrow">Companion pieces</div>
      <p class="note">📓 Wave notes + 🍚 nutrition plan → Apple Notes · 📅 sessions 7:00–8:30 → Apple Calendar · this app → logging, projections, demos.</p></div>`;
}
window.logMeas = () => {
  const wa = parseFloat(document.getElementById("mw").value);
  const sh = parseFloat(document.getElementById("ms").value);
  if (!Number.isFinite(wa) && !Number.isFinite(sh)) return;
  const k = keyOf(todayUTC());
  S.meas[k] = S.meas[k] || {};
  if (Number.isFinite(wa)) S.meas[k].wa = wa;
  if (Number.isFinite(sh)) S.meas[k].sh = sh;
  save(); render();
};
window.delDay = (dk) => { if (confirm("Delete this session log?")) { delete S.logs[dk]; save(); render(); } };
window.exportData = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `road345-backup-${keyOf(todayUTC())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
window.importSheet = () => {
  openSheet(`<button class="closex" onclick="closeSheet()">×</button><h2>Import backup</h2>
    <p class="note">Paste a backup JSON below. Replaces everything here.</p>
    <textarea id="imp" rows="6" style="width:100%"></textarea>
    <div class="rowbtns"><button class="btn" onclick="doImport()">Import</button></div>`);
};
window.doImport = () => {
  try {
    const d = JSON.parse($("#imp").value);
    if (typeof d !== "object" || !d.logs || typeof d.logs !== "object") throw 0;
    for (const k of Object.keys(d.logs)) if (!DK_RE.test(k)) delete d.logs[k];
    if (d.bw) for (const k of Object.keys(d.bw)) if (!DK_RE.test(k) || !Number.isFinite(d.bw[k])) delete d.bw[k];
    S = d; S.logs = S.logs || {}; S.gates = S.gates || {}; S.bw = S.bw || {}; S.testMax = S.testMax || {}; S.meas = S.meas || {};
    S.settings = S.settings || { offsetWeeks: 0 };
    S.spec = S.spec || { ...E.DEFAULT_SPEC }; S.ledger = S.ledger || {};
    save(); closeSheet(); render();
  } catch (e) { alert("That doesn't look like a Road-to-3/4/5 backup."); }
};

/* ── rules sheet ── */
$("#rulesbtn").addEventListener("click", () => openSheet(`<button class="closex" onclick="closeSheet()">×</button>
  <h2>The Rules</h2>
  <div class="eyebrow sig">RPE</div>
  <p class="note">6 = 4 left · 7 = 3 left · 8 = 2 left · 9 = 1 left · 10 = nothing clean left. Mains STOP at 8.</p>
  <div class="eyebrow sig" style="margin-top:10px">🟡 Yellow — 5.5–7 h sleep, hard shift, slow warm-ups, mild joint noise, prior flat session</div>
  <p class="note">Single caps at RPE 7 · back-offs −5% OR −1 set · 2 sets per accessory · skip cardio. The app applies the numbers when you tap Yellow.</p>
  <div class="eyebrow sig" style="margin-top:10px">🔴 Red — &lt;5.5 h + stress, illness, sharp pain, 2 flat sessions</div>
  <p class="note">No single. Main 3×3 @ 60%. 1–2 easy accessories, out in 30–45 min. Sharp, radiating or worsening pain → rest and get it evaluated.</p>
  <div class="eyebrow sig" style="margin-top:10px">Flat session (2+ boxes = flat)</div>
  <p class="note">Single 1+ RPE too hard · back-offs miss the cap · technique degrading across sets · bar speed clearly down · multiple exercises declining · focus gone. One flat → next related session Yellow. Two → Full Deload.</p>
  <div class="eyebrow sig" style="margin-top:10px">Gate (end of every wave, per lift)</div>
  <p class="note">Wk3 single ≤8 + back-offs inside cap + technique stable + 3 normal weeks → clean bump (+5 bench / +10 squat·dead). At the ceiling → small. Inconsistent → repeat. Two stalls → −5% and rebuild.</p>
  <div class="eyebrow sig" style="margin-top:10px">The last set is the one that grows you</div>
  <p class="note">On safe machine/cable/DB isolations in Weeks 1–2, the final set carries a <b style="color:var(--signal)">→9–10</b> marker: take it to 1 rep shy of failure, or failure. Proximity to failure is the strongest remaining lever on hypertrophy, and isolations are where it costs you almost nothing. Compounds still stop at 8. Week 3, deloads and peaks never push.</p>
  <div class="eyebrow sig" style="margin-top:10px">Log-driven accessories</div>
  <p class="note">Accessory weights advance only when your logged sets clear the TOP of the rep range on 2+ sets at (or above) the prescribed weight. Miss it → the app holds the rung. Log heavier and clear it → the app adopts your weight. Unlogged exercises follow the schedule.</p>
  <div class="eyebrow sig" style="margin-top:10px">Priorities</div>
  <p class="note">1 Health &amp; sleep · 2 School · 3 Work · 4 Comp lifts · 5 Required hypertrophy · 6 Optional pump.<br>Consistency &gt; intensity theater. Peak by removing fatigue, not proving fitness.</p>`));

/* ── router ── */
const CYCLE_DESC = { 1: "Learn accurate RPEs — add nothing", 2: "Same wave, more weight — add nothing", 3: "Accessory payoff · optional +2 sets, ONE lagging area", 4: "Competition-strict singles · reliable beats heavy", 5: "Singles climb, back-offs become doubles & triples", 6: "Peak: openers → taper → TEST Friday" };
const TABS = [["today", "Today"], ["road", "Road"], ["moves", "Moves"], ["trends", "Trends"], ["more", "More"]];
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/></svg>',
  road: '<svg viewBox="0 0 24 24"><path d="M5 20.5c7 0 3.5-6.5 7.5-8.5s5.5-3.5 5.5-8.5"/><circle cx="18" cy="3.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="20.5" r="1.4" fill="currentColor" stroke="none"/></svg>',
  moves: '<svg viewBox="0 0 24 24"><circle cx="12" cy="4.8" r="2.1"/><path d="M12 7.5v6.2M12 9.2l-5.2 2.3M12 9.2l5.2-1.2M12 13.7l-3.6 6.8M12 13.7l3.6 6.8"/></svg>',
  trends: '<svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 15l4.5-5 3.5 3 5.5-7"/><circle cx="18.5" cy="6" r="1.5" fill="currentColor" stroke="none"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
};
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) => `<button class="tab ${tab === id ? "on" : ""}" onclick="goTab('${id}')">${ICONS[id]}${label}</button>`).join("");
}
window.goTab = (id) => {
  tab = id; render(); window.scrollTo(0, 0);
  if (id === "road") setTimeout(() => { const el = document.querySelector(".wavecard.now"); if (el) el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); }, 60);
};
function render() {
  renderTabs(); stopAnim();
  const off = S.settings.offsetWeeks || 0;
  const loc = E.whereIs(todayUTC(), off);
  const ws = $("#wkstrip");
  if (loc.pre || loc.wave > 19) ws.innerHTML = "";
  else ws.innerHTML = [1, 2, 3, 4].map((w) => `<i class="${w < loc.week ? "past" : w === loc.week ? "cur" : ""}"></i>`).join("");
  $("#ctxline").innerHTML = loc.pre ? "Wave 1 begins Mon Jul 20, 2026"
    : loc.wave > 19 ? "Beyond Wave 19 — ask for the next map"
    : `Wave ${loc.wave} · Week ${loc.week} · ${E.CYCLE_NAME[E.cycleOf(loc.wave)]} · CB <b>${E.cbFor(loc.wave, S.gates).bn}/${E.cbFor(loc.wave, S.gates).sq}/${E.cbFor(loc.wave, S.gates).dl}</b>`;
  ({ today: renderToday, road: renderRoad, moves: renderMoves, trends: renderTrends, more: renderMore })[tab]();
}
window.closeSheet = closeSheet; window.moveSheet = moveSheet;
render();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
