<meta charset="utf-8">
<title>Road to 3/4/5</title>
<style>
  :root{
    --iron:#101216; --plate:#1a1e24; --plate2:#20252d; --steel:#2a303a;
    --chalk:#e9e7e1; --ash:#8b919c; --signal:#ffb224;
    --go:#46b073; --stop:#e4574b;
    --disp:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Arial Narrow',sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--iron);color:var(--chalk);font-family:var(--body);line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  #app{max-width:560px;margin:0 auto;padding:0 14px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--chalk);background:var(--iron);
    border:1px solid var(--steel);border-radius:8px;padding:6px 8px}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  input[type=number]{width:66px;text-align:center;font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--iron) 82%,rgba(16,18,22,0));
    padding:9px 0 7px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
  .brand h1 b{color:var(--signal);font-weight:700}
  .ctx{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--ash)}
  .ctx b{color:var(--chalk)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,23,29,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--steel);
    padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;
    color:var(--ash);padding:10px 2px 8px;border-radius:8px;text-align:center}
  .tab.on{color:var(--signal);background:rgba(255,178,36,.09)}

  .card{background:var(--plate);border:1px solid var(--steel);border-radius:12px;padding:11px 12px 9px;margin:8px 0}
  .card.single{background:linear-gradient(160deg,#232019 0%,var(--plate) 55%);border-color:#4a3d1d}
  .eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;color:var(--ash);margin-bottom:2px}
  .eyebrow.sig{color:var(--signal)}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;
    padding:9px 6px;border:0;border-bottom:1px solid var(--steel);background:none;color:var(--chalk);text-align:left;font:inherit}
  .frow:last-of-type{border-bottom:0}
  .frow .fn{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
  .frow .fn small{display:block;font-weight:400;font-size:12px;color:var(--ash);margin-top:2px}
  .frow .fv{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px;color:var(--chalk)}
  .frow .fv b{color:var(--signal)}
  .frow.tap:active{background:var(--plate2)}
  .frow.tap .fv::after{content:"＋";color:var(--signal);margin-left:8px;font-weight:700}
  .fmanual{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
  .fmanual label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em}
  .fmanual label:first-child{grid-column:1 / -1}
  .fmanual input{width:100%;min-width:0}
  .fmanual .btn{min-height:44px}
  .rx{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .rx small{font-size:14px;font-weight:600;color:var(--ash);letter-spacing:0}
  .capnote{font-size:12.5px;color:var(--ash);margin-top:2px}
  .capnote b{color:var(--chalk)}
  .warn{color:var(--signal)}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ibtn{color:var(--ash);border:1px solid var(--steel);border-radius:999px;width:34px;height:34px;
    font-size:15px;line-height:1;flex:none}
  .done .rx{color:var(--go)}

  .setrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{min-width:52px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:9px;border:1px solid var(--steel);
    background:var(--plate2);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ash)}
  .chip.hit{background:rgba(70,176,115,.14);border-color:#2c5c42;color:var(--go)}
  .chip.add{color:var(--signal);border-style:dashed}
  .chip.hard{border-color:#6b5518;color:var(--signal)}
  .chip.hard small{display:block;font-size:9.5px;letter-spacing:.06em;opacity:.85}
  .lset{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0}
  .lset .x{color:var(--ash);margin-left:auto;padding:4px 8px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
  .seg button{padding:10px 4px;border-radius:9px;border:1px solid var(--steel);font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ash)}
  .seg .g.on{background:rgba(70,176,115,.15);border-color:#2c5c42;color:var(--go)}
  .seg .y.on{background:rgba(255,178,36,.13);border-color:#6b5518;color:var(--signal)}
  .seg .r.on{background:rgba(228,87,75,.13);border-color:#6b2b25;color:var(--stop)}

  .daynav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .daynav button{font-size:20px;color:var(--ash);padding:4px 14px}
  .daynav .dt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--chalk)}
  .metrics{display:flex;gap:10px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
  .metrics label{font-size:12.5px;color:var(--ash)}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ash);
    text-align:left;padding:5px 6px;border-bottom:1px solid var(--steel)}
  td{padding:6px;border-bottom:1px solid #232830}
  .tablewrap{overflow-x:auto}

  .wavecard{display:block;width:100%;text-align:left}
  .wavecard .cbline{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .wavecard.now{border-color:#6b5518;background:linear-gradient(160deg,#242017 0%,var(--plate) 60%)}
  .wavecard.done19{border-color:#2c5c42}
  .gatechip{display:inline-block;font-size:11px;border:1px solid var(--steel);border-radius:999px;
    padding:2px 8px;margin-right:4px;color:var(--ash)}
  .gatechip.clean{color:var(--go);border-color:#2c5c42}
  .gatechip.warn{color:var(--signal);border-color:#6b5518}

  .moverow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 4px;
    border-bottom:1px solid #232830}
  .moverow .nm{font-weight:600;font-size:15px}
  .moverow .tag{font-size:12px;color:var(--ash)}
  .moverow canvas{flex:none;background:var(--plate);border-radius:8px}
  .grp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--signal);
    margin:18px 0 2px}

  #modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,11,14,.72)}
  #modal.open{display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--plate);border:1px solid var(--steel);border-radius:16px 16px 0 0;width:100%;
    max-width:560px;max-height:86vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:19px;margin-bottom:6px}
  .closex{float:right;color:var(--ash);font-size:22px;padding:2px 10px}
  .cues{margin:10px 0 4px;padding-left:18px;font-size:14.5px}
  .cues li{margin:5px 0}
  .ytlink{display:inline-block;margin-top:10px;color:var(--signal);font-size:14px;text-decoration:none;
    border:1px solid #6b5518;border-radius:999px;padding:6px 14px}

  .btn{display:inline-block;background:var(--signal);color:#1b1405;font-weight:700;border-radius:9px;
    padding:10px 16px;font-size:14.5px;border:1px solid transparent}
  .btn.ghost{background:none;border:1px solid var(--steel);color:var(--chalk);font-weight:600}
  .btn.danger{background:none;border:1px solid #6b2b25;color:var(--stop);font-weight:600}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

  #timer{background:var(--plate2);border:1px solid var(--steel);border-radius:999px;padding:6px 12px;
    font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ash)}
  #timer.run{color:var(--signal);border-color:#6b5518}
  #timer.over{color:var(--stop);border-color:#6b2b25}

  .chartwrap{margin:8px 0}
  .chartwrap svg{width:100%;height:auto;display:block}
  .chartwrap .hit{cursor:pointer}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ash);margin-top:4px;flex-wrap:wrap}
  .legend .k{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .note{font-size:13px;color:var(--ash)}
  .divider{border:none;border-top:1px solid var(--steel);margin:16px 0}
  .pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--steel);color:var(--ash)}
  .m2pill{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;color:var(--signal);border:1px solid #6b5518;border-radius:999px;padding:2px 8px;margin-left:4px}
  .gstat{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--steel);color:var(--ash);white-space:nowrap}
  .gstat.ahead,.gstat.reached{color:var(--go);border-color:#2c5c42}.gstat.ontrack{color:var(--chalk);border-color:#4d5564}
  .gstat.behind{color:var(--stop);border-color:#6b2b25}.gstat.early,.gstat.nodata,.gstat.photo,.gstat.phase2{color:var(--ash)}
  .grow{padding:9px 0;border-bottom:1px solid #232830}.grow:last-child{border-bottom:none}
  .grow .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .grow .gh b{font-size:14.5px}.grow .gv{font-size:13px;color:var(--chalk);font-variant-numeric:tabular-nums;margin-top:2px}
  details.proto summary{cursor:pointer;color:var(--ash);font-size:12.5px;margin-top:6px}
  .wu{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .wu span{border:1px solid var(--steel);border-radius:7px;padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ash);background:var(--plate2)}
  .wu span.ind{color:var(--signal);border-color:#6b5518}
  .summit{display:grid;gap:9px;margin:10px 0 4px}
  .srow{display:grid;grid-template-columns:60px 1fr 92px;gap:10px;align-items:center;font-size:13px;color:var(--ash)}
  .sbar{height:6px;border-radius:4px;background:var(--steel);overflow:hidden}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a1c,var(--signal));border-radius:4px}
  .sval{text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk);font-weight:700}
  .stepbtn{width:44px;height:44px;flex:none;border:1px solid var(--steel);border-radius:9px;font-size:19px;font-weight:700;color:var(--chalk);background:var(--plate2)}
  .editrow{display:flex;align-items:center;gap:8px;margin:10px 0}
  .editrow .lbl{width:56px;color:var(--ash);font-size:13px;flex:none}
  .editrow input{flex:1 1 0;min-width:0;width:0;text-align:center;font-size:18px;font-weight:700;padding:9px 6px}
  .chip.off{border-color:#6b5518;color:var(--signal)}
  .chip.extra{border-style:dashed}
  .linkbtn{background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}
  .hdrbtns{display:flex;gap:8px;align-items:center}
  .todaypill{font-size:11px;color:var(--signal);border:1px solid #6b5518;border-radius:999px;padding:2px 9px;margin-left:8px;letter-spacing:.05em}
  .cycdesc{font-size:12px;color:var(--ash);margin-top:3px}
  #timer.run{animation:tpulse 1.6s ease-in-out infinite}
  @keyframes tpulse{0%,100%{box-shadow:0 4px 18px rgba(0,0,0,.4)}50%{box-shadow:0 4px 24px rgba(255,178,36,.28)}}
  .wkstrip{display:flex;gap:3px;margin-top:7px}
  .wkstrip i{flex:1;height:3px;border-radius:2px;background:var(--steel)}
  .wkstrip i.past{background:#4d5564}
  .wkstrip i.cur{background:var(--signal)}
  .tab svg{width:20px;height:20px;display:block;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pline{display:flex;align-items:center;gap:9px;margin:0 0 4px}
  .pline span{font-size:11.5px;color:var(--ash);font-variant-numeric:tabular-nums;flex:none}
  .pbar{flex:1;height:4px;border-radius:3px;background:var(--steel);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--signal);border-radius:3px;transition:width .25s}
  .pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ash);margin-bottom:6px}
  .grab{width:38px;height:4px;border-radius:3px;background:var(--steel);margin:0 auto 12px}
  .card.single .rx{font-size:28px}
  .card.single .rx b{color:var(--signal);font-weight:800}
  .chip:active,.btn:active,.tab:active{transform:scale(.96)}
  .wavecard.past{opacity:.55}
  .done .eyebrow::after{content:" ✓";color:var(--go)}
  .card.now{background:radial-gradient(130% 90% at 92% 0%,#3a2a0b 0%,var(--plate) 58%);border-color:#5c4613;padding:13px 14px 14px;margin-top:10px}
  .card.now.hardset{border-color:#6b2b25}
  .nowtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card.now .pbar{margin:7px 0 2px;height:3px}
  .nowrow{display:flex;gap:10px;align-items:flex-start}
  .nowex{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:20px;line-height:1.1;margin-top:10px}
  .nowbig{font-family:var(--disp);font-weight:800;font-size:76px;line-height:.9;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .nowbig small{font-size:28px;color:var(--ash);font-weight:700;letter-spacing:0}
  .nowfig{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:96px;flex:none;margin-top:8px}
  .nowfig svg{width:100%;height:auto;display:block}
  .nowcue{margin-top:10px;font-size:14px;line-height:1.45;border-left:2px solid var(--signal);padding-left:10px}
  .nowcta{display:block;width:100%;margin-top:14px;min-height:60px;border-radius:14px;background:var(--signal);color:#1b1405;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .row2 .btn{min-height:44px;text-align:center}
  .stp{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;border:1px solid var(--steel);border-radius:11px;min-height:46px;overflow:hidden}
  .stp button{height:100%;font-size:20px;font-weight:700;color:var(--ash)}.stp button:active{background:var(--plate2)}
  .stp span{text-align:center;font-size:12.5px;color:var(--ash)}.stp b{font-family:var(--disp);font-size:18px;color:var(--chalk)}
  .dots{display:flex;gap:5px;margin-top:10px}
  .dots i{width:22px;height:6px;border-radius:3px;background:var(--steel)}
  .dots i.d{background:var(--go)}.dots i.c{background:var(--signal)}.dots i.h{box-shadow:inset 0 0 0 1.5px var(--stop)}
  .plates{display:flex;align-items:center;gap:3px;margin-top:12px;min-height:56px}
  .pl{display:grid;place-items:center;border-radius:4px;font-size:9.5px;font-weight:700;color:#0b0c0e}
  .p45{width:19px;height:56px;background:#d83b33;color:#fff}.p35{width:17px;height:50px;background:#e6c13a}.p25{width:15px;height:44px;background:#3d8b55;color:#fff}
  .p10{width:12px;height:34px;background:#e9e5dc}.p5{width:10px;height:28px;background:#3c6ec4}.p2{width:8px;height:22px;background:#9aa0aa}
  .sleeve{width:30px;height:10px;background:#7b818c;border-radius:2px}
  .pltxt{font-size:11.5px;color:var(--ash);margin-left:10px;line-height:1.35;font-variant-numeric:tabular-nums}
  .cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
  .cmds span{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.12em;text-align:center;padding:7px 0;border-radius:8px;background:var(--plate2);color:var(--ash)}
  .cmds span:nth-child(2){color:var(--signal)}
  .ladder{display:flex;gap:4px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .ladder span{font-weight:700;font-size:12px;padding:5px 9px;border-radius:7px;background:var(--plate2);color:#5d636e;font-variant-numeric:tabular-nums}
  .ladder span.c{background:var(--signal);color:#1b1405}.ladder span.n{color:var(--chalk);border:1px dashed var(--steel)}
  .ladder em{font-style:normal;font-size:12px;color:var(--ash);margin-left:4px}
  .flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 8px;background:#2a210c;color:var(--signal);border:1px solid #6b5518;margin-top:8px}
  .ramp{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:12px}
  .ramp div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .ramp i{width:100%;border-radius:6px 6px 3px 3px;background:var(--plate2);border:1px solid var(--steel)}
  .ramp .d i{background:#1c3a29;border-color:#2c5c42}.ramp .c i{background:var(--signal);border-color:var(--signal)}
  .ramp .t i{background:repeating-linear-gradient(135deg,#3d2c0b 0 5px,#2a210c 5px 10px);border:1px dashed var(--signal)}
  .ramp span{font-size:10.5px;color:var(--ash);white-space:nowrap;font-variant-numeric:tabular-nums}.ramp .c span{color:var(--signal)}
  .nowrate{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
  .nowrate button{min-height:70px;border-radius:13px;border:1px solid var(--steel);font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:grid;place-items:center;line-height:1.1}
  .nowrate button small{display:block;font-family:var(--body);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--ash);margin-top:3px;font-weight:600}
  .nowrate .g{color:var(--go);border-color:#2c5c42;background:rgba(70,176,115,.1)}.nowrate .y{color:var(--signal);border-color:#6b5518;background:rgba(255,178,36,.08)}.nowrate .r{color:var(--stop);border-color:#6b2b25;background:rgba(228,87,75,.08)}
  .nowrest{position:relative;display:grid;place-items:center;margin:6px 0 4px}
  .rring{width:190px;height:190px}.rring .tr{fill:none;stroke:var(--steel);stroke-width:9}.rring .tf{fill:none;stroke:var(--signal);stroke-width:9;stroke-linecap:round}
  .rnum{position:absolute;text-align:center}.rnum b{display:block;font-family:var(--disp);font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.rnum small{font-size:11px;color:var(--ash);letter-spacing:.1em;text-transform:uppercase}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .tile{background:var(--plate2);border-radius:12px;padding:10px 11px}.tile b{display:block;font-family:var(--disp);font-size:32px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile.pr{background:linear-gradient(135deg,#3b2c0a,#1e1a10);border:1px solid #6b5518}
  .brief{margin-top:2px}
  .note.sig,b.sig{color:var(--signal)}
  .frame{width:100%;max-width:330px;height:auto;display:block;margin:4px auto 0}
  input[type=range]{width:100%;accent-color:var(--signal);margin:6px 0 0;padding:0;border:0;background:none}
  .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ash);letter-spacing:.06em;text-transform:uppercase}

<script>
// ── Road to 3/4/5 · progression engine ─────────────────────────────
// Implements Powerlifting + Juicy Arms v7. Waves 1–4 mains are the
// published notes verbatim; waves 5–19 are generated from the v7 rules
// and re-computed from logged gate results.

const R5 = (x) => Math.round(x / 5) * 5;
const R25 = (x) => Math.round(x / 2.5) * 2.5;

const START = { bn: 225, sq: 315, dl: 405 };
const WAVE1_MONDAY = Date.UTC(2026, 6, 20); // 2026-07-20
const MS_DAY = 86400000;
const LIFTS = ["sq", "bn", "dl"];
const LIFT_NAME = { sq: "Squat", bn: "Bench", dl: "Deadlift" };

// gate result → CB delta
function gateDelta(lift, result, prevCB) {
  if (result === "small") return lift === "bn" ? 2.5 : 5;
  if (result === "repeat") return 0;
  if (result === "reset") return R5(prevCB * 0.95) - prevCB;
  return lift === "bn" ? 5 : 10; // clean (default)
}

// CALIBRATION: bases measured from his own sessions, pinned at the wave they took
// effect. Waves 1-2 ran the printed notes; by Wave 3 his real numbers had moved
// (bench ahead of the chain, squat and deadlift behind it), so Wave 3 runs from
// what he actually lifts. A gate with its own `cb` still overrides these.
const CALIBRATION = { 3: { bn: 255, sq: 295, dl: 385 } };
const CAL_LAST = Math.max(...Object.keys(CALIBRATION).map(Number));
// Default for a gate nobody has set yet. History (up to the last calibration)
// assumes clean, since the notes he ran were built that way. The future assumes
// "small": the small step, near Latella's average for bench and above it for squat and deadlift;
// the rated gates correct it every wave (EVIDENCE.md, Latella).
const PROJ_DEFAULT = "small";
function defaultGate(w) { return w <= CAL_LAST ? "clean" : PROJ_DEFAULT; }
// explicit base for wave w, if any: the user's gate cb wins over the calibration
function explicitCB(w, gates, L) {
  const g = (gates || {})[w];
  if (g && g.cb && Number.isFinite(g.cb[L])) return g.cb[L];
  const c = CALIBRATION[w];
  return c && Number.isFinite(c[L]) ? c[L] : null;
}

// gates: {2:{sq:'clean'|'small'|'repeat'|'reset',...}, ...} keyed by the wave the gate FEEDS INTO
function cbFor(wave, gates = {}) {
  const cb = { ...START };
  for (let w = 2; w <= wave; w++) {
    const g = gates[w] || {};
    for (const L of LIFTS) {
      const x = explicitCB(w, gates, L); // explicit CB (calibration, or set from a test day)
      if (x != null) cb[L] = x;
      else cb[L] = cb[L] + gateDelta(L, g[L] || defaultGate(w), cb[L]);
    }
  }
  return cb;
}
// the pure chain, no calibration and all-clean defaults: the arithmetic the notes were built on
function cbChain(wave, gates = {}) {
  const cb = { ...START };
  for (let w = 2; w <= wave; w++) {
    const g = gates[w] || {};
    for (const L of LIFTS) cb[L] = g.cb && Number.isFinite(g.cb[L]) ? g.cb[L] : cb[L] + gateDelta(L, g[L] || "clean", cb[L]);
  }
  return cb;
}
// first wave whose base reaches `goal` for lift L (null if not within `limit` waves)
function etaWave(L, goal, gates, limit = 80) {
  for (let w = 1; w <= limit; w++) if (cbFor(w, gates)[L] >= goal) return w;
  return null;
}

const cycleOf = (wave) => ((wave - 1) % 6) + 1;
const macroOf = (wave) => Math.floor((wave - 1) / 6) + 1;
const CYCLE_NAME = ["", "Calibration", "Build", "Accumulate", "Specificity", "Intensification", "Peak"];

// ── schedule ────────────────────────────────────────────────────────
// `off` is the schedule shift. A number (legacy) moved EVERY date, history included. Dated segments
// [{from: "YYYY-MM-DD", weeks: n}] (DATA-1): from that Monday on, the n weeks before it are repeated and
// everything later moves n weeks; nothing logged before `from` changes wave or week.
const mondayOnOrAfter = (t) => t + ((7 - ((Math.floor((t - WAVE1_MONDAY) / MS_DAY) % 7) + 7) % 7) % 7) * MS_DAY;

  if (!off) return [];
  if (!Array.isArray(off)) return [{ t: -Infinity, weeks: +off || 0 }];
  return off.map((x) => ({ t: mondayOnOrAfter(Date.parse(x.from)), weeks: Math.max(0, Math.round(+x.weeks || 0)) })).filter((x) => Number.isFinite(x.t) && x.weeks > 0);
}
function offsetAt(t, off) { let n = 0; for (const x of segsOf(off)) if (x.t <= t) n += x.weeks; return n; }
// the date of plan day `d` (days since Wave 1's Monday): the first t with t = plan date + 7 x offsetAt(t).
// A repeated week has two dates; this is the first (the one inside the original wave).
function planDateUTC(d, off) {
  const base = WAVE1_MONDAY + d * MS_DAY;
  let t = base;
  for (let i = 0; i < 64; i++) { const n = base + offsetAt(t, off) * 7 * MS_DAY; if (n === t) break; t = n; }
  return t;
}

// date (ms UTC midnight) → {wave, week, day} · day 1–5 = Mon–Fri, 0 = weekend
function whereIs(utcMid, off = 0) {
  const d = Math.floor((utcMid - WAVE1_MONDAY) / MS_DAY) - offsetAt(utcMid, off) * 7;
  if (d < 0) return { wave: 0, week: 0, day: 0, pre: true };
  const wave = Math.floor(d / 28) + 1;
  const week = Math.floor((d % 28) / 7) + 1;
  const dow = d % 7; // 0=Mon … 6=Sun
  return { wave, week, day: dow + 1, dow }; // 7-day week: 1=Mon Squat … 6=Sat Spec, 7=Sun optional
}

// ── incline bench: a tracked secondary press ramping to a 225 goal ──────
// Starts at 180 (≈0.80× his 225 bench CB, the usual flat:incline ratio) and
// gains in lockstep with the bench gate — one gate decision, two lifts. Reaches
// 225 in nine incline steps: wave 11 on clean gates, wave 19 on the small-step default.
// Did the lifter clear a standard for this exercise during a given wave?
// null = no data (caller falls back to the schedule) · true = advance · false = hold.
function clearedInWave(pkey, wave, minW, minReps, minSets, ctx = HISTCTX) {
  if (!ctx || !ctx.index) return null;
  const hist = ctx.index[pkey];
  if (!hist || !hist.length) return null;
  const from = waveStartUTC(wave, SH(ctx)), to = waveStartUTC(wave + 1, SH(ctx));
  const inWave = hist.filter((e) => e.t >= from && e.t < to);
  if (!inWave.length) return null;
  return inWave.filter((e) => e.w >= minW - 0.01 && e.r >= minReps).length >= minSets;
}

// ── TRACKED SECONDARY LIFTS ─────────────────────────────────────────────
// Each has a cycle base, a goal on the card, a weekly ramp, and log-adaptive

//   incline → 225 (upper chest) · chin-up → +90 (ARMS) · RDL → 315 (HAMSTRINGS)
const TRACKED = {

    top:  [[0.78, 5, "7"], [0.82, 4, "7.5"], [0.86, 3, "8"], null],

  },
  rdl: {
    key: "rdl", name: "RDL", start: 275, goal: 315, step: 5, anchor: "dl",
    top:  [[0.88, 6, "7"], [0.94, 5, "7.5"], [1.00, 4, "8"], null],
    back: [[0.80, 8, 3], [0.83, 7, 3], [0.86, 6, 3], [0.62, 6, 2]],

const INCLINE_START = TRACKED.inc.start, INCLINE_GOAL = TRACKED.inc.goal;
// Arms are the stated calling card. 13" at 182 lb is a genuinely lagging part;

// proportion on purpose. 13" -> 16" is roughly +50% cross-sectional area, a multi-year target.
const ARM_START = 13, ARM_GOAL = 16;

// Log-adaptive base: a past wave advances only if its week-3 top set was cleared.
// Unlogged waves track the anchor lift's gate, so casual use still progresses.
function trackedCB(id, wave, gates, ctx = HISTCTX) {
  const T = TRACKED[id];

  for (let w = 1; w < wave; w++) {
    const target = R5(cb * T.top[2][0]);

      // (calibration or test) is a re-measurement of the anchor, not progress, so it
      // moves this lift by nothing: a 30 lb deadlift correction says nothing about the RDL.
      const d = explicitCB(w + 1, gates, T.anchor) != null ? 0
        : cbFor(w + 1, gates)[T.anchor] - cbFor(w, gates)[T.anchor];
      cb += Math.max(-T.step, Math.min(d, T.step));

  const label = (v) => (T.added ? "+" + v : v);
  if (tp) out.push({ type: "single", lift: id, name: T.name + " \u2014 top set", w: R5(cb * tp[0]), reps: tp[1], sets: 1,
    rpe: tp[2], moveId: T.key, pkey: T.key + "-top", note: T.note, added: !!T.added, disp: label(R5(cb * tp[0])) });

}

const inclineFor = (wave, week, gates) => trackedFor("inc", wave, week, gates);

const RPE_CAP = { 1: 7, 2: 7.5, 3: 8 };
const RPE_CAP_C5 = { 1: 7.5, 2: 8, 3: "8–8.5" };

function mainsFor(wave, gates) {
  const cb = cbFor(wave, gates);

  const out = { cb, cyc, notes: null, gen: {} };
  for (const L of LIFTS) {

    let backs;
    if (cyc === 5) backs = PCT.backC5[L].map(([p, r, s]) => [R5(cb[L] * p), r, s]);
    else backs = PCT.back[L].map((p, i) => [R5(cb[L] * p), PCT.scheme[L][i][0], PCT.scheme[L][i][1]]);
    out.gen[L] = { s: singles, b: backs, l: R5(cb[L] * 0.65) };
  }
  out.gen.ps = [...PCT.ps.map((p) => R5(cb.sq * p)), R5(cb.sq * 0.565)];
  out.gen.pb = [...PCT.pb.map((p) => R5(cb.bn * p)), R5(cb.bn * 0.565)];
  out.gen.ohp = null; // computed in ohpFor
  out.gen.bridge = wave >= 3 ? { sq: R5(cb.sq * PCT.bridge.sq), bn: R5(cb.bn * PCT.bridge.bn), dl: R5(cb.dl * PCT.bridge.dl) } : null;
  out.gen.yellow = [0, 1, 2].map((i) => [
    R5(out.gen.sq.b[i][0] * 0.95), R5(out.gen.bn.b[i][0] * 0.95), R5(out.gen.ps[i] * 0.95),
    R5(out.gen.pb[i] * 0.95), R5(out.gen.dl.b[i][0] * 0.95),
  ]);
  out.gen.red = [R5(cb.sq * 0.6), R5(cb.bn * 0.6), R5(cb.dl * 0.6)];
  out.gen.deload = { m: [R5(cb.sq * 0.55), R5(cb.bn * 0.55), R5(cb.dl * 0.55)], ps: R5(cb.sq * 0.52), pb: R5(cb.bn * 0.51) };
  return out;
}
// the printed notes are only valid while the chain they were built on holds:
// any non-clean gate or explicit base (calibration included) at or before this wave
// means the tables must be generated from the real base instead.
function hasNonCleanGate(gates, upTo) {
  for (let w = 2; w <= upTo; w++) {
    const g = (gates || {})[w];
    if (g && LIFTS.some((L) => g[L] && g[L] !== "clean")) return true;
    if (LIFTS.some((L) => explicitCB(w, gates, L) != null)) return true;
  }
  return false;
}
// unified accessor: mains data for a wave regardless of source
function mainTables(wave, gates) {
  const m = mainsFor(wave, gates);
  if (m.notes) return { cb: m.cb, cyc: m.cyc, t: m.notes, explicit: true };
  return { cb: m.cb, cyc: m.cyc, t: m.gen, explicit: false };
}

function ohpFor(wave, gates) {
  // Double progression, log-adaptive: 3x6 -> add reps to 3x8 clean -> +5 lb -> back to 3x6.
  // Advances a rung when 2+ sets cleared the wave's top rep target at the rung weight;
  // unlogged waves follow the schedule, logged-and-missed holds.
  const st = accStateLogged({ w: 95, steps: [6, 7, 8], inc: 5, db: false, i0: 0, pkey: "ohp" }, wave, HISTCTX);
  const lo = st.steps ? st.steps[st.i] : [6, 7, 8][st.i], hi = [6, 7, 8][Math.min(st.i + 1, 2)];
  return [[st.w, lo, 3], [st.w, hi, 3], [st.w, hi, 2], [R5(st.w * 0.78), 6, 2]];
}

// state of an accessory at a given wave (1-indexed): {w, i} where reps = (steps[i], steps[i+1])
// `since`: the wave an exercise entered the plan. Waves before it never ran it, so
// they must not advance its rung (lpcalf, incdb and farmer arrived in Wave 3).
function accState(a, wave) {
  let w = a.w, i = a.i0 || 0;
  const last = a.steps.length - 1;
  for (let k = Math.max(1, a.since || 1); k < wave; k++) {
    if (i + 1 >= last) { // hit the top this wave → bump next wave
      if (a.inc > 0) w = a.db ? R25(w + a.inc) : w + a.inc;
      i = 0;
    } else i++;
  }
  return { w, i };
}
// ── log-driven progression ──────────────────────────────────────────
// Every logged set is stamped with a stable exercise key (`k`). At each wave
// boundary the rung advances ONLY if some session that wave hit the top of the
// rep range on 2+ sets at >= the rung weight. Logged heavier + cleared reps →
// the user's weight is adopted (loads are floors). Unlogged waves fall back to
// the schedule, so casual use degrades gracefully.
const pkeyOf = (name) => String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let HISTCTX = null; // set per sessionFor call: { index: {pkey: [{t,w,r}]}, offsetWeeks }

function accStateLogged(def, wave, ctx) {
  if (!ctx || !ctx.index) return accState(def, wave);
  const hist = ctx.index[def.pkey];
  if (!hist || !hist.length) { const st = accState(def, wave); return { ...st, prog: null }; }
  let w = def.w, i = def.i0 || 0;
  const last = def.steps.length - 1;
  // Corrections for prescriptions from Wave 4 on (Waves 1-3 still display what was run): a peak
  // wave's 1-set maintenance follows the schedule (it neither holds nor adopts), deload sets never
  // qualify, the latest qualifying session wins, and a heavier logged weight is adopted on the
  // exercise's own grid, never rounded up.
  const fixed = wave > CAL_LAST, off = SH(ctx);
  const step = def.inc > 0 ? def.inc : (def.db ? 2.5 : 5);
  const need = fixed ? Math.min(2, def.sets || 2) : 2; // ENG-4: 1-set work clears on its one set
  for (let k = Math.max(1, def.since || 1); k < wave; k++) {
    const atTop = i + 1 >= last;
    const topReq = def.steps[Math.min(i + 1, last)];
    const from = waveStartUTC(k, off), to = waveStartUTC(k + 1, off);
    if (fixed && cycleOf(k) === 6) { // peak: 1-set "easy" maintenance, follow the schedule
      if (atTop) { if (def.inc > 0) w = def.db ? R25(w + def.inc) : w + def.inc; i = 0; } else i++;
      continue;
    }
    const inWave = hist.filter((e) => e.t >= from && e.t < to && !(fixed && whereIs(e.t, off).week === 4));
    // group into sessions by calendar day
    const byDay = new Map();
    for (const e of inWave) { const d = Math.floor(e.t / MS_DAY); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(e); }
    let qualified = null;
    const days = fixed ? [...byDay.keys()].sort((a, b) => b - a) : [...byDay.keys()];
    for (const dd of days) {
      const sess = byDay.get(dd);
      if (sess.length < need) continue; // one set of 2+-set work is a fluke, not a rung clear
      // 2+ sets clearing the top is the documented rule. Requiring EVERY set to
      // clear made progression nearly impossible on 4-5 set exercises, and
      // directly contradicted the "final set to RPE 9-10" cue — which drops reps
      // on the last set by design. Logging honestly must never cost a rung.
      const clears = sess.filter((e) => e.r >= topReq && e.w >= w - 0.01);
      if (clears.length >= need) { qualified = clears; break; }
    }
    if (qualified) {
      const minW = Math.min(...qualified.map((e) => e.w));
      const base = fixed ? (minW > w + 1e-6 ? w + Math.floor((minW - w) / step + 1e-9) * step : w) // adopt heavier logged weight, on the grid
        : Math.max(w, def.db ? R25(minW) : R5(minW));
      if (atTop) { w = def.inc > 0 ? (def.db ? R25(base + def.inc) : base + def.inc) : base; i = 0; }
      else { w = base; i = i + 1; }
    } else if (!byDay.size) {
      // nothing logged this wave → scheduled fallback
      if (atTop) { if (def.inc > 0) w = def.db ? R25(w + def.inc) : w + def.inc; i = 0; }
      else i++;
    }
    // logged but failed → hold the rung
  }
  const sched = accState(def, wave);
  const prog = (w === sched.w && i === sched.i) ? "on"
    : (w < sched.w || (w === sched.w && i < sched.i)) ? "held" : "ahead";
  return { w, i, prog };
}

// An ACC entry as prescribed at a wave. `up` holds the fields that change from up.from on
// (sets, w3, anchor, rpe8, cap; `since` only to restart a ladder at up.from); earlier waves are
// history and print what was run. A different movement gets a new id, never a new w/steps/inc.
const accAt = (a, wave) => (a.up && wave >= a.up.from ? { ...a, ...a.up } : a);
// is the entry in the plan this wave? `from` = first wave it runs, `until` = last
const accLive = (a, wave) => !(a.from && wave < a.from) && !(a.until && wave > a.until);
// Thursday shed its delt isolation to Saturday in v32; the peak builder honours it too
const THU_DROP = new Set(["latthu", "rdf"]);

// prescription for accessory a at wave/week (week 1–4), with cycle trims
function accFor(a0, wave, week) {
  const a = accAt(a0, wave);
  const st = accStateLogged({ w: a.w, steps: a.steps, inc: a.inc, db: a.db, i0: a.i0, pkey: a.id, since: a.since, sets: a.sets }, wave, HISTCTX);
  const { w, i } = st;
  const cyc = cycleOf(wave);
  const last = a.steps.length - 1;
  const repLow = a.steps[i], repHigh = a.steps[Math.min(i + 1, last)];
  let sets = week === 3 ? a.w3 : a.sets;
  if (cyc === 5 && a.comp) sets = Math.max(1, sets - 1);
  if (cyc === 6) {
    if (week === 1) sets = Math.max(1, Math.round(sets * 0.7));
    else if (week === 2) sets = Math.max(1, Math.round(sets * 0.5));
    else return null; // wk 3–4 of a peak: no accessory work
  }
  if (week === 4) {
    const lw = a.w === 0 ? 0 : a.db ? R25(w * 0.7) : R5(w * 0.7);
    // from Wave 4 a deload never prescribes more sets than a loading week (it doubled the 1-set shrug)
    return { w: lw, reps: repLow, sets: wave >= 4 ? Math.min(2, a.sets) : 2, rpe: "6–7", light: true };
  }
  const reps = week === 2 ? repHigh : repLow;
  const topSet = repHigh === a.steps[last] && week === 2;
  // Proximity to failure is the highest-leverage variable left in this program.
  // v7: "safe machine/cable isolations — final set may reach RPE 9-10 in Wks 1-2."
  // Compounds stay capped at 8; week 3 trims; deload and peak never push.
  // v32: ONE failure set per muscle per day. Only the anchor movement for a muscle
  // earns it; everything after stops at RPE 8. ~35 failure sets/wk was the fatigue leak.
  const lastHard = !!a.anchor && !a.comp && week <= 2 && cyc <= 4;
  return { w, reps, sets, rpe: week === 3 || a.rpe8 ? "8" : "8–9", top: topSet, prog: st.prog, lastHard };
}

// ex helper — spec exercises run the SAME double-progression machine as weekday
// accessories: `steps` are rep waypoints, weight climbs by `inc` once the top of the
// range is cleared. `wv` (wave) is threaded in, so Wave 19 is not Wave 1.
// ENG-5: while sundaySession builds a Wave 4+ template, the Saturday keys it must not share
let SX_TAKEN = null;
function sx(name, seed, steps, sets, rpe, arch, moveId, db, cap, inc, wv, since) {
  const key = SX_TAKEN && SX_TAKEN.has(pkeyOf(name)) ? "sun-" + pkeyOf(name) : pkeyOf(name);
  const st = accStateLogged({ w: seed, steps, inc: inc == null ? 5 : inc, db: !!db, i0: 0, pkey: key, since, sets }, wv || 1, HISTCTX);
  const last = steps.length - 1;
  const lo = steps[st.i], hi = steps[Math.min(st.i + 1, last)];
  return {
    type: "accessory", name, w: st.w, reps: lo === hi ? String(lo) : lo + "\u2013" + hi,
    sets, rpe, arch, moveId, db: !!db, cap: cap || "", spec: true, repN: lo, repHi: hi, inc: inc == null ? 5 : inc,
    top: hi === steps[last] && steps.length > 1, pkey: key, prog: st.prog,
  };
}

// is Sunday actually planned/running this wave-week? (Wks 1–2 of Cycles 1–4, and enabled)
function sundayPlanned(wave, week, spec) {
  return !!(spec && spec.sundayOn) && cycleOf(wave) <= 4 && week <= 2;
}
// do the weekday volume transfers fire this week? (only when Sunday runs)
function transfersActive(wave, week, spec) { return sundayPlanned(wave, week, spec); }
// ENG-11: the weekday arm-block sets that move to Sunday when it runs (Wave 4+)
const SUNDAY_MOVES = new Set(["curlmon", "ohtue"]);
// the weekly side-delt cap (README invariants) and what counts toward it
const CAP_SIDE = 16;
const SIDE_DELT = (n) => /Lateral Raise|Cross-Body Cable Y-Raise/i.test(n || "") && !/Pulldown|Prone/i.test(n || "");
function sideDeltSetsMonSat(wave, week, sat) {
  let n = 0;
  for (const a0 of ACC) {
    if (a0.primer || !accLive(a0, wave) || (a0.day === 4 && THU_DROP.has(a0.id))) continue;
    if (!SIDE_DELT(accAt(a0, wave).name)) continue;
    const p = accFor(a0, wave, week); if (p) n += p.sets;
  }
  for (const b of sat || []) if (b && b.type === "accessory" && SIDE_DELT(b.name)) n += b.sets;
  return n;
}

// Saturday: paused bench is on Thursday, so Saturday = pure frame-isolation overload
function saturdaySession(wave, week, spec) {
  spec = spec || DEFAULT_SPEC;
  const cyc = cycleOf(wave);
  const blocks = [];
  if (cyc === 6) { // peak: no specialization
    blocks.push({ type: "test", name: "Peak week — no specialization", note: "Brief maintenance only if anything. Frame work resumes next macro — the peak exposes strength, it doesn't build the physique." });
    return blocks;
  }
  if (week === 4) { // light week / deload: maintenance only
    blocks.push(sx("Machine / Cable Lateral Raise", 12.5, [12, 15], 2, "6–7", "lateral", "cablelat", false, "Light maintenance — deliberately flat", 0, 1));
    blocks.push(sx("Reverse-Pec-Deck", 50, [15], 2, "6–7", "rearfly", "revpec", false, "Light maintenance", 0, 1));
    blocks.push(sx("Cable Triceps", 40, [12, 15], 2, "6–7", "pushdown", "pushdown", false, "Light maintenance", 0, 1));
    if (wave >= 4) { // the light-week crunch was heavier (100) than the working one (80): derive it from the working rung
      const cr = sx("Ab Wheel / Cable Crunch", 70, [8, 10, 12, 15], 2, "6–7", "crunch", "crunch", false, "Light maintenance", 10, wave);
      blocks.push({ ...cr, w: R5(cr.w * 0.7), reps: "10", repN: 10, repHi: 10, top: false, light: true });
    } else blocks.push(sx("Ab Wheel / Cable Crunch", 100, [10, 15], 2, "6–7", "crunch", "crunch", false, "", 0, 1));
    return blocks;
  }
  const reduced = week === 3 || cyc === 5; // Wk3 and Cycle 5: fewer sets
  const frame = FRAME_MODULE[spec.framePrimary](wave);
  frame.forEach((ex) => blocks.push({ ...ex, sets: reduced ? 2 : ex.sets, primary: true }));
  // declared weak points (Wave 3 feedback): a second upper-chest press angle and real grip work
  blocks.push(sx("Incline DB Press (30\u00b0)", 60, [8, 10, 12], reduced ? 2 : wave >= 4 ? 4 : 3, "8", "incpress", "incdb", true, "UPPER CHEST \u2014 dumbbells go deeper than the bar, so the clavicular pec is loaded at length. 30\u00b0 bench, elbows ~45\u00b0, stop the descent when the stretch peaks", 5, wave, 3));
  // UPPER TRAPS (Wave 4+): the second shrug day, 24 h AFTER the deadlift and 48 h before Monday's
  // anchor, so no trap or grip work lands in the 24 h before a deadlift. Straps on, before the
  // farmer hold so grip never limits it. The traps frame already shrugs, so it skips this.
  if (wave >= 4 && spec.framePrimary !== "traps") blocks.push(sx("Cable Y-Shrug (arms 30\u00b0 out)", 50, [10, 12, 15], reduced ? 2 : 3, "8", "shrug", "yshrug", false, "UPPER TRAPS, second weekly exposure (Monday's shrug is the anchor). Two low pulleys, hands about 30\u00b0 out from the sides (dumbbells if the pulleys are taken: then always dumbbells, so the log stays one implement). Shrug up and slightly in toward the ears, 1-s hold, full stretch at the bottom. Straps on: the farmer hold after it is the grip work. Arms out raised upper- and lower-trap activity over a standard shrug (Pizzari 2014). Stop at RPE 8; first two weeks RPE 7", 5, wave, 4));
  blocks.push(sx("Heavy Farmer Hold (seconds)", 80, [30, 40, 50], 2, "8\u20139", "shrug", "farmer", true, "FOREARMS \u2014 grip is the forearm's compound. Heaviest dumbbells you can hold for the time, shoulders back, no straps ever", 10, wave, 3));
  const triSpec = spec.detail === "triceps";
  // From Wave 4 a reduced week TRIMS the secondary slot to 2 sets instead of deleting it: deleting
  // it took the only Saturday lat work out of every week 3 and all of Cycle 5.
  if (!reduced || wave >= 4) {
    // the "omit secondary on triceps weeks" rule assumes a TORSO primary; when arms IS
    // the primary, dropping it would leave the day with zero back work.
    if (!triSpec || spec.framePrimary === "arms") {
      const sec = SECONDARY_SLOT[spec.frameSecondary || "none"](wave);
      if (sec) blocks.push(reduced ? { ...sec, sets: Math.min(sec.sets, 2) } : sec);
    }
  }
  if (triSpec) {
    // when arms IS the priority the module already has overhead work — don't double it
    if (spec.framePrimary !== "arms") blocks.push(sx("Overhead Cable Extension", 50, [10, 12, 15], reduced ? 2 : 3, "8–9", "ohtri", "ohrope", false, "Long-head bias — arms overhead", 5, wave));
    if (!reduced) blocks.push(sx("Rope / Single-Arm Pushdown", 90, [10, 12, 15], 3, "8–9", "pushdown", "pushdown", false, "", 5, wave));
  } else {
    if (spec.framePrimary === "arms") blocks.push(sx("Rope Pushdown", 50, [12, 15, 20], reduced ? 2 : 3, "8–9", "pushdown", "pushdown", false, "Lateral + medial head \u2014 overhead work is already in the module", 5, wave));
    else blocks.push(sx("Overhead Cable Extension", 50, [10, 12, 15], reduced ? 2 : 3, "8–9", "ohtri", "ohrope", false, "Triceps slot", 5, wave));
  }
  for (const b of balanceSlot(spec.framePrimary, wave, reduced)) blocks.push(b);
  blocks.push(sx("Ab Wheel / Cable Crunch", 70, [8, 10, 12, 15], 2, "8–9", "crunch", "crunch", false, "", 10, wave));
  // priority isolation goes early: the side-delt builder moves to second, right after the first curl
  const yi = blocks.findIndex((b) => /Y-Raise/.test(b.name || ""));
  if (yi > 2) { const [y] = blocks.splice(yi, 1); blocks.splice(2, 0, y); }
  // Wave 4+: the rear-delt raise sits right after the incline DB press: same bench, antagonist superset (Zhang 2025)
  const ri = blocks.findIndex((b) => b.pkey === "chest-supported-rear-delt-raise-thumbs-up");
  if (ri > -1) { const [r] = blocks.splice(ri, 1); blocks.splice(blocks.findIndex((b) => /Incline DB Press/.test(b.name || "")) + 1, 0, r); }
  return blocks;
}

// Sunday: optional detail — only Wks 1–2 of Cycles 1–4 and enabled
function sundaySession(wave, week, spec) {
  spec = spec || DEFAULT_SPEC;
  if (!sundayPlanned(wave, week, spec)) return null;
  const pick = () => (spec.framePrimary === "arms" ? DETAIL_TEMPLATE.armsPrimary(wave)
    : isDefaultSpec(spec) ? DETAIL_TEMPLATE.recommended(wave)
    : (DETAIL_TEMPLATE[spec.detail] || DETAIL_TEMPLATE.recommended)(wave));
  if (wave < 4) return pick();
  // Wave 4+: a Sunday exercise that shares a name with a Saturday one logs under "sun-<key>", so the two
  // templates (different seeds and rep ranges) never move each other's rung (ENG-5)
  const sat = saturdaySession(wave, week, spec);
  SX_TAKEN = new Set(sat.map((b) => b && b.pkey).filter(Boolean));
  let tmpl;
  try { tmpl = pick(); } finally { SX_TAKEN = null; }
  // ENG-11: the side-delt cap holds with Sunday on: Sunday's laterals take only what Mon-Sat left
  let room = CAP_SIDE - sideDeltSetsMonSat(wave, week, sat);
  return tmpl.map((b) => { if (!SIDE_DELT(b.name)) return b; const n = Math.max(0, Math.min(b.sets, room)); room -= n; return n ? { ...b, sets: n } : null; }).filter(Boolean);
}
function isDefaultSpec(spec) {
  return spec && spec.framePrimary === "shoulders" && spec.frameSecondary === "latwidth" && spec.detail === "triceps";
}

// ── warm-ups ────────────────────────────────────────────────────────
// the printed indicator (225 / 165 / 315), capped by the Wave 1 ratio to the base
// (225/315, 165/225, 315/405) so a calibrated or reset base never puts the bridge under it
const IND_PCT = { sq: 0.714, bn: 0.733, dl: 0.778 }, IND_FIXED = { sq: 225, bn: 165, dl: 315 };
function warmups(lift, wave, gates, week) {
  const { t, cb } = mainTables(wave, gates);
  // Wave 4+ deload: ramp only to the light triple. No indicator or bridge single heavier than the work.
  if (week === 4 && wave >= 4 && t[lift] && t[lift].l)
    return { sq: [["Bar", 10], [95, 5], [135, 5], [185, 3]], bn: [["Bar", 15], [95, 8], [135, 5], [155, 3]], dl: [[135, 5], [225, 3], [275, 2]] }[lift]
      .filter((r) => typeof r[0] !== "number" || r[0] < t[lift].l);
  const br = t.bridge ? t.bridge[lift] : null;
  const ind = Math.min(IND_FIXED[lift], R5(cb[lift] * IND_PCT[lift]));
  const ramp = {
    sq: [["Bar", 10], [95, 5], [135, 5], [185, 3]],
    bn: [["Bar", 15], [95, 8], [135, 5], [155, 3]],
    dl: [[135, 5], [225, 3], [275, 2]],

  const lj = judge({ now: leanNow, target: TARGETS.lean, monthsLeft, trend: leanT, noise: NOISE.bf / 100 * (bwNow || 190) });
  goals.push({ key: "lean", label: "200 lb @ 15%", metric: "Lean mass = 7-day bodyweight x (1 - body fat)",
    now: leanNow != null ? `${leanNow} lb lean · ${bfNow}% fat${bf.calibratedBy ? " (DXA-calibrated)" : " (tape)"} · ${bwNow != null ? bwNow + " lb" : "—"}` : bwNow != null ? `${bwNow} lb · log waist + neck for body fat` : "log weight, waist and neck",
    target: `${TARGETS.lean} lb lean · ${TARGETS.bf}% · ${TARGETS.bw} lb`, ...lj,
    unit: "lb lean/month", lever: lj.status === "behind" ? [gainLever, ...lever].filter(Boolean) : [],
    note: lean.calibratedBy ? null : "Tape body fat reads about 6 points off DXA and misses part of each change; one DXA scan calibrates it, and the verdict waits for 6 months of monthly tapes or a DXA pair." });
  // 3. arms
  const aj = judge({ now: armNow, target: TARGETS.arm, monthsLeft, trend: armT, noise: NOISE.ar });
  goals.push({ key: "arms", label: "16\" arms", metric: "Flexed arm, cold, monthly", now: armNow != null ? `${armNow}"` : "measure flexed", target: `${TARGETS.arm}"`, ...aj,
    unit: "in/month", lever: aj.status === "behind" ? [gainLever, ...lever, "arm rungs held? check the arm cards for ⏸"].filter(Boolean) : [] });
  // 4. 3D shoulders
  const rj = judge({ now: ratioNow, target: TARGETS.ratio, monthsLeft, trend: ratioT, noise: 0.02 });
  goals.push({ key: "shoulders", label: "3D shoulders", metric: "Shoulder ÷ waist + monthly photos (front, side, rear)",
    now: ratioNow != null ? ratioNow.toFixed(2) : "measure shoulders + waist", target: TARGETS.ratio.toFixed(2), ...rj, unit: "/month",
    lever: rj.status === "behind" ? ["side and rear delts: check the lateral and reverse-pec cards for ⏸", ...lever] : [] });
  // 5-7. the photo goals: process metrics + photos, judged by eye at the 4-week check
  const r = inp.regions || {};
  goals.push({ key: "upperchest", label: "Prominent upper chest", metric: "Photos (front, side) + weekly incline-biased sets", now: `${r.upperChest || 0} sets/wk planned`, target: "visible shelf in the side photo", status: "photo" });
  goals.push({ key: "upperback", label: "Prominent upper back", metric: "Photos (rear relaxed, lat spread) + weekly sets", now: `traps ${r.traps || 0} · rear delts ${r.rearDelts || 0} · rows ${r.rows || 0} sets/wk`, target: "thick yoke in the rear photo", status: "photo" });
  goals.push({ key: "back", label: "Shredded back", metric: "Body fat (Phase 2 ~11%) + rear photos", now: bfNow != null ? `${bfNow}% fat` : "log waist + neck", target: `~${TARGETS.bfPhase2}% (Phase 2)`, status: "phase2",
    note: "Detail is a leanness result: back work builds the muscle now, the Phase 2 cut reveals it. Spot work does not remove local fat." });
  return { goals, monthsLeft: Math.round(monthsLeft * 10) / 10 };
}

function svgChart(pts, opts = {}) {
  const W = 520, H = 170, P = 34;
  if (!pts.length) return `<p class="note">${opts.empty || "Nothing logged yet — this chart grows as you train."}</p>`;
  const xs = pts.map((p) => p.x), x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const inBand = (opts.band || []).filter((p) => p.x >= x0 && p.x <= x1);

    <text x="${P - 5}" y="${Y(y0 + pad) + 4}" fill="#8b919c" font-size="11" text-anchor="end">${Math.round(y0 + pad)}</text>

}

function weeklyAverages(n) {
  const out = []; const t = todayUTC();
  for (let i = 0; i < n; i++) {
    const end = t - i * 7 * E.MS_DAY, start = end - 6 * E.MS_DAY;
    const vals = [];
    for (let d = start; d <= end; d += E.MS_DAY) { const v = S.bw[keyOf(d)]; if (Number.isFinite(v)) vals.push(v); }
    if (!vals.length) continue;
    const avg = Math.round((vals.reduce((a, b) => a + b) / vals.length) * 10) / 10;
    out.unshift({ wk: fmtShort(start), avg, d: null, call: "" });
  }
  for (let i = 1; i < out.length; i++) out[i].d = Math.round((out[i].avg - out[i - 1].avg) * 10) / 10;
  for (let i = 0; i < out.length; i++) {
    const d = out[i].d;
    out[i].call = NUTRI.weekCall(d, S.nutri.mode, out[i].avg);
  }
  return out.slice(-4);
}

async function forceUpdate() {

  // server answered: offline, the cached app is the only app there is
  if (!navigator.onLine) return alert("Force update needs a connection — the app you have still works offline.");
  try { const r = await fetch("./index.html?u=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; }
  catch (e) { return alert("Could not reach the server — nothing changed."); }
  try { if ("serviceWorker" in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace(location.pathname + "?u=" + Date.now());
}

  <div class="eyebrow sig" style="margin-top:10px">Log-driven accessories</div>
  <p class="note">Accessory weights advance only when your logged sets clear the TOP of the rep range on 2+ sets (on its one set for 1-set work) at (or above) the prescribed weight. Miss it → the app holds the rung. Log heavier and clear it → the app adopts your weight. Unlogged exercises follow the schedule.</p>
  <div class="eyebrow sig" style="margin-top:10px">Priorities</div>
  <p class="note">1 Health &amp; sleep · 2 School · 3 Work · 4 Comp lifts · 5 Required hypertrophy · 6 Optional pump.<br>Consistency &gt; intensity theater. Peak by removing fatigue, not proving fitness.</p>`));

/* ── router ── */
const CYCLE_DESC = { 1: "Learn accurate RPEs — add nothing", 2: "Same wave, more weight — add nothing", 3: "Accessory payoff · optional +2 sets, ONE lagging area", 4: "Competition-strict singles · reliable beats heavy", 5: "Singles climb, back-offs become doubles & triples", 6: "Peak: openers → taper → TEST Friday" };
const TABS = [["today", "Today"], ["road", "Road"], ["moves", "Body"], ["trends", "Trends"], ["more", "More"]];
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/></svg>',
  road: '<svg viewBox="0 0 24 24"><path d="M5 20.5c7 0 3.5-6.5 7.5-8.5s5.5-3.5 5.5-8.5"/><circle cx="18" cy="3.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="20.5" r="1.4" fill="currentColor" stroke="none"/></svg>',
  moves: '<svg viewBox="0 0 24 24"><circle cx="12" cy="4.2" r="2.1"/><path d="M6 8.2c2.2 1.1 9.8 1.1 12 0M8.6 8.9l.9 6.1M15.4 8.9l-.9 6.1M9.5 15l-.8 6M14.5 15l.8 6M9.5 15h5"/></svg>',
  trends: '<svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 15l4.5-5 3.5 3 5.5-7"/><circle cx="18.5" cy="6" r="1.5" fill="currentColor" stroke="none"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
};
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) => `<button class="tab ${tab === id ? "on" : ""}" onclick="goTab('${id}')">${ICONS[id]}${label}</button>`).join("");
}
window.goTab = (id) => {
  tab = id; render(); window.scrollTo(0, 0);
  if (id === "road") setTimeout(() => { const el = document.querySelector(".wavecard.now"); if (el) el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); }, 60);
};
function render() {
  try { renderInner(); } catch (e) { renderRecovery(e); }
}
// DATA-2: a screen that throws on the saved data never leaves the app blank: back up, import, undo, erase
function renderRecovery(e) {
  const prev = localStorage.getItem(KEY + ".prev");
  $("#view").innerHTML = `<div class="card single"><div class="eyebrow sig">This screen could not read the saved data</div>
    <p class="note">${esc(String((e && e.message) || e))}. Your data is untouched. Back it up first, then undo the last import or import a good backup.</p>
    <div class="rowbtns"><button class="btn" onclick="rawBackup()">Back up raw data</button><button class="btn ghost" onclick="importSheet()">Import</button>${prev != null ? `<button class="btn ghost" onclick="undoImport()">Undo last import</button>` : ""}
    <button class="btn danger" onclick="if(confirm('Erase ALL logs, gates and settings?')){localStorage.removeItem(KEY);location.reload()}">Erase</button></div></div>`;
}
function renderInner() {
  renderTabs(); stopAnim();
  const off = SHIFT();
  const loc = E.whereIs(todayUTC(), off);
  const ws = $("#wkstrip");
  if (loc.pre || loc.wave > 19) ws.innerHTML = "";
  else ws.innerHTML = [1, 2, 3, 4].map((w) => `<i class="${w < loc.week ? "past" : w === loc.week ? "cur" : ""}"></i>`).join("");
  $("#ctxline").innerHTML = loc.pre ? "Wave 1 begins " + fmt(E.waveStartUTC(1, off))
    : loc.wave > 19 ? "Beyond Wave 19 — ask for the next map"
    : `${loc.wave < E.MODEL2_FROM ? "Model 1 · " : ""}Wave ${loc.wave} · Week ${loc.week} · ${E.CYCLE_NAME[E.cycleOf(loc.wave)]} · CB <b>${E.cbFor(loc.wave, GX()).bn}/${E.cbFor(loc.wave, GX()).sq}/${E.cbFor(loc.wave, GX()).dl}</b>`;
  ({ today: renderToday, road: renderRoad, moves: renderBody, trends: renderTrends, more: renderMore })[tab]();
}
window.closeSheet = closeSheet; window.moveSheet = moveSheet;
render();
</script>
